<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-label="停止等待、GBN、SR的发送和接收窗口推进">
  <defs>
    <marker id="arqa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1120" height="760" fill="#fffdf8"/>
  <text x="560" y="30" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">三种 ARQ 的窗口：大小、编号与向前推进</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <text x="40" y="65" font-size="12" fill="#52605a">蓝色 = 发送窗口 W_T；绿色 = 接收窗口 W_R；数字 = n 位序号（这里画 0–7 便于看推进）。</text>

    <text x="40" y="105" font-weight="700">A. 停止等待：W_T=1，W_R=1，1 位序号</text>
    <text x="40" y="135" font-size="12">初始：发送窗口 [0]，接收窗口 [0]</text>
    <g font-size="12">
      <rect x="40" y="145" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="62" y="165" text-anchor="middle">0</text>
      <rect x="85" y="145" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="107" y="165" text-anchor="middle">0</text>
    </g>
    <path d="M160 160 L250 160" stroke="#b54b45" stroke-width="2" marker-end="url(#arqa)"/>
    <text x="205" y="150" text-anchor="middle" font-size="11">ACK0 后</text>
    <text x="270" y="135" font-size="12">推进：发送窗口 [1]，接收窗口 [1]</text>
    <g font-size="12">
      <rect x="270" y="145" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="292" y="165" text-anchor="middle">1</text>
      <rect x="315" y="145" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="337" y="165" text-anchor="middle">1</text>
    </g>
    <text x="400" y="165" font-size="12">每收一个 ACK，窗口向前 1 格；没有流水线。</text>

    <line x1="40" y1="215" x2="1080" y2="215" stroke="#e1d8c8"/>
    <text x="40" y="250" font-weight="700">B. GBN：W_T=4，W_R=1（n=3）</text>
    <text x="40" y="280" font-size="12">初始：发送窗口 [0,1,2,3]，接收窗口 [0]</text>
    <g font-size="12">
      <rect x="40" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="62" y="310" text-anchor="middle">0</text>
      <rect x="85" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="107" y="310" text-anchor="middle">1</text>
      <rect x="130" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="152" y="310" text-anchor="middle">2</text>
      <rect x="175" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="197" y="310" text-anchor="middle">3</text>
      <rect x="220" y="290" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="242" y="310" text-anchor="middle">0</text>
    </g>
    <text x="295" y="310" font-size="12">收到 ACK1（累积确认 0、1）后，窗口从 0 推进到 2：</text>
    <g font-size="12">
      <rect x="600" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="622" y="310" text-anchor="middle">2</text>
      <rect x="645" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="667" y="310" text-anchor="middle">3</text>
      <rect x="690" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="712" y="310" text-anchor="middle">4</text>
      <rect x="735" y="290" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="757" y="310" text-anchor="middle">5</text>
      <rect x="780" y="290" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="802" y="310" text-anchor="middle">2</text>
    </g>
    <text x="40" y="345" font-size="12">推进规则：<tspan font-weight="700" fill="#b54b45">W_R 始终为 1，接收方只按序收；ACK 是累积确认，ACK n 表示 n 及以前都收到</tspan>。</text>
    <text x="40" y="368" font-size="12">窗口最多 2^n−1 个；n=3 时最多 7 个，窗口不能等于 8，否则新旧序号会混淆。</text>

    <line x1="40" y1="405" x2="1080" y2="405" stroke="#e1d8c8"/>
    <text x="40" y="440" font-weight="700">C. SR：W_T=4，W_R=4（n=3）</text>
    <text x="40" y="470" font-size="12">初始：发送窗口 [0,1,2,3]，接收窗口 [0,1,2,3]</text>
    <g font-size="12">
      <rect x="40" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="62" y="500" text-anchor="middle">0</text>
      <rect x="85" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="107" y="500" text-anchor="middle">1</text>
      <rect x="130" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="152" y="500" text-anchor="middle">2</text>
      <rect x="175" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="197" y="500" text-anchor="middle">3</text>
      <rect x="220" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="242" y="500" text-anchor="middle">0</text>
      <rect x="265" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="287" y="500" text-anchor="middle">1</text>
      <rect x="310" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="332" y="500" text-anchor="middle">2</text>
      <rect x="355" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="377" y="500" text-anchor="middle">3</text>
    </g>
    <text x="445" y="500" font-size="12">0、1 被确认；2 丢失，3 被缓存：</text>
    <g font-size="12">
      <rect x="700" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="722" y="500" text-anchor="middle">2</text>
      <rect x="745" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="767" y="500" text-anchor="middle">3</text>
      <rect x="790" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="812" y="500" text-anchor="middle">4</text>
      <rect x="835" y="480" width="45" height="30" fill="#e9f2f6" stroke="#3f6f8a"/><text x="857" y="500" text-anchor="middle">5</text>
      <rect x="880" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="902" y="500" text-anchor="middle">2</text>
      <rect x="925" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="947" y="500" text-anchor="middle">3</text>
      <rect x="970" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="992" y="500" text-anchor="middle">4</text>
      <rect x="1015" y="480" width="45" height="30" fill="#eef3e4" stroke="#6f8f45"/><text x="1037" y="500" text-anchor="middle">5</text>
    </g>
    <text x="40" y="540" font-size="12">推进规则：<tspan font-weight="700" fill="#b54b45">逐帧确认，接收窗口可缓存乱序帧；只重传丢失的 2，收到后窗口一起推进到 4</tspan>。</text>
    <text x="40" y="565" font-size="12">约束：W_T + W_R ≤ 2^n，且 W_R ≤ W_T；常取 W_T=W_R=2^(n−1)。n=3 时各 4 个。</text>

    <rect x="40" y="605" width="1030" height="120" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="60" y="630" font-weight="700">窗口大小总结</text>
    <text x="60" y="655" font-size="16" font-family="serif">W_T + W_R ≤ 2^n</text>
    <text x="60" y="680" font-size="12">停止等待：1+1=2=2¹；GBN：W_R=1，W_T≤2^n−1；SR：W_R≤W_T，W_T+W_R≤2^n，常各取 2^(n−1)。</text>
    <text x="60" y="703" font-size="12" fill="#b54b45">窗口不能只看“越大越快”；超过序号空间会新旧混淆，接收方无法判断重复帧。</text>
  </g>
</svg>
