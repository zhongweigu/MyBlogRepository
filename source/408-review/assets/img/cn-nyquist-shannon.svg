<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-label="奈氏准则与香农定理">
  <rect width="1080" height="620" fill="#fffdf8"/>
  <text x="540" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">信道极限速率：奈氏看状态数，香农看信噪比</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <rect x="45" y="75" width="470" height="190" rx="4" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="70" y="103" font-weight="700">奈氏准则（无噪声）</text>
    <text x="70" y="135" font-size="20" font-family="serif">C = 2W log₂V</text>
    <text x="70" y="165" font-size="13">W：带宽（Hz）</text>
    <text x="70" y="188" font-size="13">V：一个码元的离散状态数</text>
    <text x="70" y="211" font-size="13">2W：理想低通最高码元速率</text>
    <text x="70" y="241" font-size="12" fill="#52605a">只给带宽 + 状态数/调制方式时用。</text>

    <rect x="565" y="75" width="470" height="190" rx="4" fill="#f7ecd9" stroke="#a8782c"/>
    <text x="590" y="103" font-weight="700">香农定理（有噪声）</text>
    <text x="590" y="135" font-size="20" font-family="serif">C = W log₂(1 + S/N)</text>
    <text x="590" y="165" font-size="13">W：带宽（Hz）</text>
    <text x="590" y="188" font-size="13">S/N：信号平均功率 / 噪声平均功率</text>
    <text x="590" y="211" font-size="13">SNR(dB) = 10 log₁₀(S/N)</text>
    <text x="590" y="241" font-size="12" fill="#52605a">30dB → S/N=1000；20dB → 100。</text>

    <text x="540" y="305" text-anchor="middle" font-size="13" fill="#b54b45">同时给出两组条件时：分别算，取较小值</text>
    <line x1="540" y1="285" x2="540" y2="320" stroke="#b54b45" stroke-width="2"/>
    <path d="M300 270 L300 320 L500 320" stroke="#4d5b66" stroke-width="2" fill="none"/>
    <path d="M780 270 L780 320 L580 320" stroke="#4d5b66" stroke-width="2" fill="none"/>
    <rect x="360" y="330" width="360" height="55" rx="4" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="540" y="354" text-anchor="middle" font-weight="700">实际极限 = min(奈氏, 香农)</text>
    <text x="540" y="374" text-anchor="middle" font-size="12">再乘“实际/理论”比例，得到实际速率</text>

    <text x="45" y="435" font-weight="700">步骤</text>
    <text x="45" y="460">① 把 dB 换成 S/N；② 判断有无噪声；③ 选公式/两式都算；④ 按题目问“理论/实际”取比例。</text>
    <text x="45" y="485" font-size="12" fill="#52605a">奈氏中的 V 是状态数，不是 bit 数；QAM-16 的 V=16，一码元 4 bit。</text>

    <rect x="45" y="515" width="990" height="55" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="65" y="538" font-weight="700">易错</text>
    <text x="65" y="560" font-size="13">“带宽 8kHz”不等于 8kb/s；无噪声信道的极限由 2W log₂V 决定，不是直接 W。</text>
  </g>
</svg>
