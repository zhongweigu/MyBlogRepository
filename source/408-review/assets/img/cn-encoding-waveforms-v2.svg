<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 840">
<rect width="1080" height="840" fill="#fffdf8"/>
<text x="540" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">五种基带编码：同一串比特的五种画法</text>
<g font-family="sans-serif" font-size="14" fill="#24313a">
<text x="45" y="70" font-weight="700">比特</text>
<line x1="145" y1="80" x2="145" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="189.0" y="70" text-anchor="middle" font-size="14">0</text><line x1="233" y1="80" x2="233" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="277.0" y="70" text-anchor="middle" font-size="14">1</text><line x1="321" y1="80" x2="321" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="365.0" y="70" text-anchor="middle" font-size="14">1</text><line x1="409" y1="80" x2="409" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="453.0" y="70" text-anchor="middle" font-size="14">0</text><line x1="497" y1="80" x2="497" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="541.0" y="70" text-anchor="middle" font-size="14">0</text><line x1="585" y1="80" x2="585" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="629.0" y="70" text-anchor="middle" font-size="14">1</text><line x1="673" y1="80" x2="673" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="717.0" y="70" text-anchor="middle" font-size="14">1</text><line x1="761" y1="80" x2="761" y2="710" stroke="#e1d8c8" stroke-dasharray="4 4"/><text x="805.0" y="70" text-anchor="middle" font-size="14">1</text><line x1="145" y1="135.0" x2="849" y2="135.0" stroke="#b9b0a2" stroke-dasharray="6 4"/><text x="100" y="139.0" text-anchor="end" font-size="11" fill="#6b777f">0</text><text x="45" y="140.0" font-family="sans-serif" font-size="14" font-weight="700">NRZ</text><path d="M145,165 L233,165 L233,105 L321,105 L321,105 L409,105 L409,165 L497,165 L497,165 L585,165 L585,105 L673,105 L673,105 L761,105 L761,105 L849,105" fill="none" stroke="#24313a" stroke-width="2.6"/><text x="900" y="140.0" font-family="sans-serif" font-size="11" fill="#52605a">整段电平：高1、低0；虚线为零电平</text><text x="45" y="270.0" font-family="sans-serif" font-size="14" font-weight="700">NRZI</text><path d="M145,235 L233,235 L233,235 L321,235 L321,235 L409,235 L409,295 L497,295 L497,235 L585,235 L585,235 L673,235 L673,235 L761,235 L761,235 L849,235" fill="none" stroke="#24313a" stroke-width="2.6"/><text x="900" y="270.0" font-family="sans-serif" font-size="11" fill="#52605a">跳变=0，不变=1</text><line x1="145" y1="395.0" x2="849" y2="395.0" stroke="#b9b0a2" stroke-dasharray="6 4"/><text x="100" y="399.0" text-anchor="end" font-size="11" fill="#6b777f">0</text><text x="45" y="400.0" font-family="sans-serif" font-size="14" font-weight="700">RZ（归零）</text><path d="M145,395.0 L145,430 L189.0,430 L189.0,395.0 L233,395.0 L233,395.0 L233,360 L277.0,360 L277.0,395.0 L321,395.0 L321,395.0 L321,360 L365.0,360 L365.0,395.0 L409,395.0 L409,395.0 L409,430 L453.0,430 L453.0,395.0 L497,395.0 L497,395.0 L497,430 L541.0,430 L541.0,395.0 L585,395.0 L585,395.0 L585,360 L629.0,360 L629.0,395.0 L673,395.0 L673,395.0 L673,360 L717.0,360 L717.0,395.0 L761,395.0 L761,395.0 L761,360 L805.0,360 L805.0,395.0 L849,395.0" fill="none" stroke="#24313a" stroke-width="2.6"/><text x="900" y="400.0" font-family="sans-serif" font-size="11" fill="#52605a">1 前半高、后半零；0 前半低、后半零</text><text x="45" y="530.0" font-family="sans-serif" font-size="14" font-weight="700">曼彻斯特</text><path d="M145,495 L189.0,495 L189.0,555 L233,555 L233,555 L277.0,555 L277.0,495 L321,495 L321,555 L365.0,555 L365.0,495 L409,495 L409,495 L453.0,495 L453.0,555 L497,555 L497,495 L541.0,495 L541.0,555 L585,555 L585,555 L629.0,555 L629.0,495 L673,495 L673,555 L717.0,555 L717.0,495 L761,495 L761,555 L805.0,555 L805.0,495 L849,495" fill="none" stroke="#24313a" stroke-width="2.6"/><text x="900" y="530.0" font-family="sans-serif" font-size="11" fill="#52605a">每比特中间必跳变</text><text x="45" y="660.0" font-family="sans-serif" font-size="14" font-weight="700">差分曼彻斯特</text><path d="M145,685 L189.0,685 L189.0,625 L233,625 L233,625 L277.0,625 L277.0,685 L321,685 L321,685 L365.0,685 L365.0,625 L409,625 L409,685 L453.0,685 L453.0,625 L497,625 L497,685 L541.0,685 L541.0,625 L585,625 L585,625 L629.0,625 L629.0,685 L673,685 L673,685 L717.0,685 L717.0,625 L761,625 L761,625 L805.0,625 L805.0,685 L849,685" fill="none" stroke="#24313a" stroke-width="2.6"/><text x="900" y="660.0" font-family="sans-serif" font-size="11" fill="#52605a">中间必跳变；起始边界有跳变=0</text>
<rect x="45" y="735" width="990" height="80" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
<text x="65" y="758" font-weight="700">读图</text>
<text x="65" y="781" font-size="12">NRZ 以中间虚线为零电平，高=1、低=0；NRZI 看边界跳变；RZ 每比特后半回到零；曼彻斯特看中间跳变；差分曼彻斯特看起始边界。</text>
<text x="65" y="801" font-size="11" fill="#6b777f">不同教材可能把 0/1 约定反过来；10BaseT 常用“0 高→低、1 低→高”，做题以题图/定义为准。</text>
</g></svg>