<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" role="img" aria-label="B+ 树叶结点分裂与删除合并">
  <defs>
    <marker id="bpa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="1060" height="620" fill="#fffdf8"/>
  <text x="530" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">B+ 树：叶分裂把“新键的副本”送进父结点</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="75" font-weight="700">A. 叶容量 3 个键：插入 25，叶溢出</text>
    <rect x="60" y="100" width="320" height="46" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="90" y="129">10</text><text x="170" y="129">20</text><text x="250" y="129">30</text><text x="330" y="129">25</text>
    <text x="60" y="172" font-size="12" fill="#b54b45">排序后 10,20,25,30；容量 3，必须分裂。</text>
    <path d="M220 150 L220 190" stroke="#4d5b66" stroke-width="2" marker-end="url(#bpa)"/>

    <rect x="160" y="200" width="170" height="46" fill="#f7ecd9" stroke="#a8782c"/>
    <text x="245" y="229" text-anchor="middle">父：25</text>
    <rect x="50" y="285" width="190" height="46" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="145" y="314" text-anchor="middle">叶：10,20</text>
    <rect x="300" y="285" width="190" height="46" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="395" y="314" text-anchor="middle">叶：25,30</text>
    <path d="M220 246 L165 285" stroke="#4d5b66" stroke-width="2" marker-end="url(#bpa)"/>
    <path d="M270 246 L375 285" stroke="#4d5b66" stroke-width="2" marker-end="url(#bpa)"/>
    <text x="50" y="360" font-size="12">父键 25 是右叶的最小键（副本上提）；叶之间仍按链表相连。</text>

    <text x="45" y="420" font-weight="700">B. 删除 20：左叶只剩 10，低于最小键数</text>
    <rect x="50" y="445" width="190" height="46" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="145" y="474" text-anchor="middle">叶：10（不足）</text>
    <rect x="300" y="445" width="190" height="46" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="395" y="474" text-anchor="middle">叶：25,30</text>
    <path d="M240 468 L300 468" stroke="#4d5b66" stroke-width="2" marker-end="url(#bpa)"/>
    <rect x="50" y="525" width="440" height="46" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="270" y="554" text-anchor="middle">合并叶：10,25,30；父中的分隔键 25 删除/调整</text>
    <path d="M270 491 L270 525" stroke="#4d5b66" stroke-width="2" marker-end="url(#bpa)"/>

    <text x="560" y="445" font-weight="700">与 B 树的区别</text>
    <text x="560" y="470">B 树：关键字只存一份，分裂时中位键上移，原结点不再保留它。</text>
    <text x="560" y="494">B+ 树：所有键都在叶层；内部结点只存索引，分裂时把右叶最小键的副本上提。</text>
    <text x="560" y="518">删除时 B+ 树从叶开始借位/合并；内部索引键要跟着右叶最小键更新。</text>
    <text x="560" y="542" font-size="12" fill="#b54b45">本图用“叶容量 3、最小 2”的简化例子；实际阶数按题目 m 计算。</text>

    <text x="45" y="605" font-size="12" fill="#6b777f">B+ 树查找最终一定到叶；内部结点命中只是“导航”，不是数据记录。</text>
  </g>
</svg>
