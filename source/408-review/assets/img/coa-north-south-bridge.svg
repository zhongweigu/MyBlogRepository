<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="南北桥结构">
  <rect width="1100" height="500" fill="#fffdf8"/>
  <g font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="38" fill="#b54634" font-size="12" font-weight="800" letter-spacing="2">NORTH / SOUTH BRIDGE · 南北桥</text>
    <text x="40" y="68" fill="#1f2328" font-size="24" font-weight="700">北桥管高速，南桥管低速</text>

    <rect x="420" y="100" width="160" height="60" fill="#1f2328"/>
    <text x="500" y="126" fill="#fffdf8" font-size="14" text-anchor="middle">CPU</text>
    <text x="500" y="146" fill="#d9d2c4" font-size="9" text-anchor="middle">FSB / 片内互连</text>

    <line x1="500" y1="160" x2="500" y2="200" stroke="#1f2328" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="400" y="205" width="200" height="72" fill="#eef2f8" stroke="#355f91"/>
    <text x="500" y="233" fill="#1f2328" font-size="15" text-anchor="middle">北桥</text>
    <text x="500" y="253" fill="#667078" font-size="9" text-anchor="middle">高速：主存 / 显卡 / PCIe</text>
    <text x="500" y="268" fill="#667078" font-size="8.5" text-anchor="middle">传统上含内存控制器</text>

    <line x1="600" y1="230" x2="690" y2="230" stroke="#355f91" stroke-width="1.3" marker-end="url(#b)"/>
    <rect x="695" y="200" width="130" height="52" fill="#fffdf8" stroke="#355f91"/>
    <text x="760" y="222" fill="#1f2328" font-size="12" text-anchor="middle">主存</text>
    <text x="760" y="239" fill="#667078" font-size="8" text-anchor="middle">DRAM</text>

    <line x1="600" y1="245" x2="690" y2="285" stroke="#355f91" stroke-width="1.3" marker-end="url(#b)"/>
    <rect x="695" y="270" width="130" height="52" fill="#fffdf8" stroke="#355f91"/>
    <text x="760" y="292" fill="#1f2328" font-size="12" text-anchor="middle">显卡 / PCIe</text>
    <text x="760" y="309" fill="#667078" font-size="8" text-anchor="middle">高带宽设备</text>

    <line x1="500" y1="277" x2="500" y2="325" stroke="#a9651f" stroke-width="1.4" marker-end="url(#c)"/>
    <rect x="400" y="330" width="200" height="60" fill="#fbf4ea" stroke="#a9651f"/>
    <text x="500" y="356" fill="#1f2328" font-size="15" text-anchor="middle">南桥 / PCH</text>
    <text x="500" y="376" fill="#667078" font-size="9" text-anchor="middle">低速 I/O 与外围接口</text>

    <line x1="400" y1="360" x2="300" y2="360" stroke="#a9651f" stroke-width="1.3" marker-end="url(#c)"/>
    <rect x="160" y="335" width="130" height="50" fill="#fffdf8" stroke="#a9651f"/>
    <text x="225" y="356" fill="#1f2328" font-size="11" text-anchor="middle">USB / SATA</text>
    <text x="225" y="373" fill="#667078" font-size="8" text-anchor="middle">外设接口</text>

    <line x1="400" y1="385" x2="300" y2="410" stroke="#a9651f" stroke-width="1.3" marker-end="url(#c)"/>
    <rect x="160" y="390" width="130" height="50" fill="#fffdf8" stroke="#a9651f"/>
    <text x="225" y="411" fill="#1f2328" font-size="11" text-anchor="middle">音频 / 网卡</text>
    <text x="225" y="428" fill="#667078" font-size="8" text-anchor="middle">低速 I/O</text>

    <rect x="860" y="330" width="200" height="120" fill="#f8f2e7" stroke="#d9d2c4"/>
    <text x="880" y="355" fill="#b54634" font-size="10" font-weight="700">考点</text>
    <text x="880" y="377" fill="#1f2328" font-size="9.5">北桥靠近 CPU，连高速部件；</text>
    <text x="880" y="395" fill="#1f2328" font-size="9.5">南桥连低速 I/O，再连北桥。</text>
    <text x="880" y="417" fill="#667078" font-size="8.5">现代 SoC 把北桥集成进 CPU，</text>
    <text x="880" y="433" fill="#667078" font-size="8.5">南桥变为 PCH，但“高速/低速”不变。</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1f2328"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#355f91"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a9651f"/></marker>
  </defs>
</svg>
