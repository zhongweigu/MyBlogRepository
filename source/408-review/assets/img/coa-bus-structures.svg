<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-label="单总线、双总线、三总线结构">
  <rect width="1100" height="650" fill="#fffdf8"/>
  <g font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="38" fill="#b54634" font-size="12" font-weight="800" letter-spacing="2">BUS STRUCTURE · 总线结构</text>
    <text x="40" y="68" fill="#1f2328" font-size="24" font-weight="700">单总线 → 双总线 → 三总线</text>

    <rect x="35" y="95" width="320" height="235" fill="#f8f2e7" stroke="#d9d2c4"/>
    <text x="55" y="122" fill="#b54634" font-size="14" font-weight="700">① 单总线</text>
    <rect x="55" y="140" width="70" height="38" fill="#1f2328"/><text x="90" y="164" fill="#fffdf8" font-size="11" text-anchor="middle">CPU</text>
    <rect x="155" y="140" width="90" height="38" fill="#fffdf8" stroke="#1f2328"/><text x="200" y="164" fill="#1f2328" font-size="11" text-anchor="middle">主存</text>
    <rect x="275" y="140" width="60" height="38" fill="#fffdf8" stroke="#1f2328"/><text x="305" y="164" fill="#1f2328" font-size="11" text-anchor="middle">I/O</text>
    <line x1="55" y1="215" x2="335" y2="215" stroke="#1f2328" stroke-width="5"/>
    <line x1="90" y1="178" x2="90" y2="215" stroke="#1f2328" stroke-width="1.5"/>
    <line x1="200" y1="178" x2="200" y2="215" stroke="#1f2328" stroke-width="1.5"/>
    <line x1="305" y1="178" x2="305" y2="215" stroke="#1f2328" stroke-width="1.5"/>
    <text x="55" y="245" fill="#667078" font-size="9.5">所有部件共享一条系统总线；同一时刻只能一对通信。</text>
    <text x="55" y="266" fill="#667078" font-size="9.5">结构简单、成本低；CPU 访存与 I/O 争总线。</text>
    <text x="55" y="288" fill="#14756f" font-size="9.5">适合低端/简单系统，带宽是瓶颈。</text>

    <rect x="390" y="95" width="320" height="235" fill="#e8f2ef" stroke="#14756f"/>
    <text x="410" y="122" fill="#14756f" font-size="14" font-weight="700">② 双总线</text>
    <rect x="410" y="140" width="65" height="36" fill="#1f2328"/><text x="442" y="163" fill="#fffdf8" font-size="10" text-anchor="middle">CPU</text>
    <rect x="520" y="140" width="80" height="36" fill="#fffdf8" stroke="#14756f"/><text x="560" y="163" fill="#1f2328" font-size="10" text-anchor="middle">主存</text>
    <line x1="475" y1="158" x2="520" y2="158" stroke="#14756f" stroke-width="4"/>
    <text x="497" y="148" fill="#14756f" font-size="8" text-anchor="middle">主存总线</text>
    <rect x="410" y="215" width="65" height="36" fill="#1f2328"/><text x="442" y="238" fill="#fffdf8" font-size="10" text-anchor="middle">CPU</text>
    <rect x="520" y="215" width="80" height="36" fill="#fffdf8" stroke="#14756f"/><text x="560" y="238" fill="#1f2328" font-size="10" text-anchor="middle">I/O</text>
    <line x1="475" y1="233" x2="520" y2="233" stroke="#14756f" stroke-width="4"/>
    <text x="497" y="223" fill="#14756f" font-size="8" text-anchor="middle">I/O 总线</text>
    <rect x="625" y="170" width="55" height="52" fill="#fbf4ea" stroke="#a9651f"/><text x="652" y="192" fill="#1f2328" font-size="9" text-anchor="middle">桥</text><text x="652" y="206" fill="#667078" font-size="8" text-anchor="middle">/控制器</text>
    <line x1="600" y1="158" x2="625" y2="185" stroke="#a9651f" stroke-width="1.2"/>
    <line x1="600" y1="233" x2="625" y2="205" stroke="#a9651f" stroke-width="1.2"/>
    <text x="410" y="285" fill="#667078" font-size="9.5">主存总线与 I/O 总线分开，I/O 不直接占用主存总线。</text>
    <text x="410" y="307" fill="#667078" font-size="9.5">比单总线并行性好；桥/控制器增加成本。</text>

    <rect x="745" y="95" width="320" height="235" fill="#eef2f8" stroke="#355f91"/>
    <text x="765" y="122" fill="#355f91" font-size="14" font-weight="700">③ 三总线</text>
    <rect x="765" y="140" width="60" height="32" fill="#1f2328"/><text x="795" y="161" fill="#fffdf8" font-size="9" text-anchor="middle">CPU</text>
    <rect x="860" y="140" width="70" height="32" fill="#fffdf8" stroke="#355f91"/><text x="895" y="161" fill="#1f2328" font-size="9" text-anchor="middle">主存</text>
    <line x1="825" y1="156" x2="860" y2="156" stroke="#355f91" stroke-width="3"/><text x="842" y="147" fill="#355f91" font-size="7" text-anchor="middle">主存总线</text>
    <rect x="765" y="195" width="60" height="32" fill="#1f2328"/><text x="795" y="216" fill="#fffdf8" font-size="9" text-anchor="middle">CPU</text>
    <rect x="860" y="195" width="70" height="32" fill="#fffdf8" stroke="#355f91"/><text x="895" y="216" fill="#1f2328" font-size="9" text-anchor="middle">I/O</text>
    <line x1="825" y1="211" x2="860" y2="211" stroke="#355f91" stroke-width="3"/><text x="842" y="202" fill="#355f91" font-size="7" text-anchor="middle">I/O 总线</text>
    <rect x="765" y="250" width="60" height="32" fill="#1f2328"/><text x="795" y="271" fill="#fffdf8" font-size="9" text-anchor="middle">DMA</text>
    <rect x="860" y="250" width="70" height="32" fill="#fffdf8" stroke="#355f91"/><text x="895" y="271" fill="#1f2328" font-size="9" text-anchor="middle">主存</text>
    <line x1="825" y1="266" x2="860" y2="266" stroke="#355f91" stroke-width="3"/><text x="842" y="257" fill="#355f91" font-size="7" text-anchor="middle">DMA 总线</text>
    <text x="765" y="305" fill="#667078" font-size="9.5">DMA 设备可经 DMA 总线直接访存，CPU 不参与搬运。</text>

    <rect x="35" y="360" width="1030" height="250" fill="#fff8f4" stroke="#b54634"/>
    <text x="55" y="388" fill="#b54634" font-size="12" font-weight="700">读图要点</text>
    <text x="55" y="414" fill="#1f2328" font-size="11">① 单总线：所有部件共享同一组线；同一时刻只有一对主/从设备通信，CPU 访存和 I/O 争用总线。</text>
    <text x="55" y="438" fill="#1f2328" font-size="11">② 双总线：主存总线和 I/O 总线分开，通过桥连接；CPU 访存和 I/O 可以更并行，但 I/O 数据仍要经过桥/CPU。</text>
    <text x="55" y="462" fill="#1f2328" font-size="11">③ 三总线：再加 DMA 总线，DMA 设备直接访问主存；并行性最好，结构最复杂、成本最高。</text>
    <text x="55" y="492" fill="#667078" font-size="10">总线结构越复杂，并行性越好，但桥、控制器和布线成本越高；408 选择题常问“哪种结构允许 DMA 直接访存”。</text>
    <text x="55" y="520" fill="#667078" font-size="10">现代系统用点对点高速链路（PCIe）替代共享总线，但单/双/三总线的概念仍是分析基础。</text>
    <text x="55" y="552" fill="#b54634" font-size="10" font-weight="700">易错：单总线并不是“只有一根线”，而是一组共享的数据/地址/控制线。</text>
    <text x="55" y="576" fill="#b54634" font-size="10" font-weight="700">双总线不是“两条完全独立的总线”，通常要靠桥连接。</text>
  </g>
</svg>
