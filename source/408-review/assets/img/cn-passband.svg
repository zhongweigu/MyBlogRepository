<text x="65" y="513" font-weight="700">QAM</text>
<text x="65" y="535" font-size="13">同时改变幅度和相位：若幅度 m 种、相位 n 种，状态数最多 m×n；R_b = B log2(mn)。</text>
<text x="45" y="585" font-size="12" fill="#6b777f">图中波形为原理示意，不按真实载波频率/幅度比例绘制；考试看“改哪个参数”和状态数。</text>
