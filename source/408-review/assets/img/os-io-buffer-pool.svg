<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-label="缓冲池三队列四方式">
  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="960" height="550" fill="#fffdf8"/>
  <text x="480" y="30" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="#24313a">缓冲池：三条队列与四种工作方式</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <rect x="360" y="70" width="240" height="54" rx="5" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="480" y="94" text-anchor="middle" font-weight="700">空缓冲队列 emq</text>
    <text x="480" y="113" text-anchor="middle" font-size="12" fill="#52605a">可被收容输入/输出使用</text>

    <rect x="70" y="230" width="240" height="54" rx="5" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="190" y="254" text-anchor="middle" font-weight="700">输入缓冲队列 inq</text>
    <text x="190" y="273" text-anchor="middle" font-size="12" fill="#52605a">装满输入数据，等待提取</text>

    <rect x="650" y="230" width="240" height="54" rx="5" fill="#f7ecd9" stroke="#a8782c"/>
    <text x="770" y="254" text-anchor="middle" font-weight="700">输出缓冲队列 outq</text>
    <text x="770" y="273" text-anchor="middle" font-size="12" fill="#52605a">装满输出数据，等待设备</text>

    <rect x="70" y="390" width="180" height="54" rx="5" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="160" y="414" text-anchor="middle" font-weight="700">输入设备</text>
    <text x="160" y="433" text-anchor="middle" font-size="12" fill="#52605a">或输入进程</text>

    <rect x="390" y="390" width="180" height="54" rx="5" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="480" y="414" text-anchor="middle" font-weight="700">用户/CPU</text>
    <text x="480" y="433" text-anchor="middle" font-size="12" fill="#52605a">提取输入 / 收容输出</text>

    <rect x="710" y="390" width="180" height="54" rx="5" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="800" y="414" text-anchor="middle" font-weight="700">输出设备</text>
    <text x="800" y="433" text-anchor="middle" font-size="12" fill="#52605a">或输出进程</text>

    <path d="M160 390 C160 330, 300 300, 390 280" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#pa)"/>
    <text x="210" y="340" fill="#b54b45">① 收容输入</text>
    <path d="M310 257 C360 300, 420 340, 480 390" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#pa)"/>
    <text x="300" y="235" fill="#3f6f8f">② 提取输入（inq→用户）</text>
    <path d="M570 390 C640 330, 700 300, 730 284" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#pa)"/>
    <text x="560" y="350" fill="#b54b45">③ 收容输出（用户→outq）</text>
    <path d="M650 257 C700 300, 760 330, 800 390" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#pa)"/>
    <text x="700" y="235" fill="#3f6f8f">④ 提取输出</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#52605a">
    <text x="55" y="500">① 收容输入：先从 emq 取空缓冲，设备写入后挂 inq</text>
    <text x="55" y="520">② 提取输入：从 inq 取，用户读完后归还 emq</text>
    <text x="550" y="500">③ 收容输出：先从 emq 取空缓冲，用户写入后挂 outq</text>
    <text x="550" y="520">④ 提取输出：从 outq 取，设备输出后归还 emq</text>
  </g>
</svg>
