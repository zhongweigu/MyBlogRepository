<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-label="Dijkstra 最短路径的距离更新与最短路径树">
  <defs>
    <marker id="dja" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
    <marker id="djb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1080" height="640" fill="#fffdf8"/>
  <text x="540" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">Dijkstra：每次选当前最近的未确定点，松弛它的出边</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <circle cx="100" cy="320" r="32" fill="#eef3e4" stroke="#6f8f45" stroke-width="2"/><text x="100" y="326" text-anchor="middle" font-weight="700">A</text>
    <circle cx="330" cy="170" r="32" fill="#e9f2f6" stroke="#4d7f95" stroke-width="2"/><text x="330" y="176" text-anchor="middle" font-weight="700">B</text>
    <circle cx="330" cy="470" r="32" fill="#e9f2f6" stroke="#4d7f95" stroke-width="2"/><text x="330" y="476" text-anchor="middle" font-weight="700">C</text>
    <circle cx="600" cy="320" r="32" fill="#f7ecd9" stroke="#a8782c" stroke-width="2"/><text x="600" y="326" text-anchor="middle" font-weight="700">D</text>
    <circle cx="870" cy="320" r="32" fill="#f3e6e6" stroke="#a85a5a" stroke-width="2"/><text x="870" y="326" text-anchor="middle" font-weight="700">E</text>

    <g stroke="#9aa6ad" stroke-width="1.8" fill="none">
      <path d="M132 308 L298 188" marker-end="url(#dja)"/>
      <path d="M132 332 L298 456" marker-end="url(#dja)"/>
      <path d="M350 198 L560 300" marker-end="url(#dja)"/>
      <path d="M362 180 L570 170 L570 292" marker-end="url(#dja)"/>
      <path d="M362 460 L570 345" marker-end="url(#dja)"/>
      <path d="M632 320 L838 320" marker-end="url(#dja)"/>
    </g>
    <g font-size="12" fill="#52605a">
      <text x="195" y="240">A→B：1</text>
      <text x="190" y="408">A→C：4</text>
      <text x="445" y="250">B→C：2</text>
      <text x="500" y="155">B→D：5</text>
      <text x="450" y="405">C→D：1</text>
      <text x="720" y="305">D→E：3</text>
    </g>

    <path d="M125 300 C190 220, 260 180, 300 180" stroke="#b54b45" stroke-width="3" fill="none" marker-end="url(#djb)"/>
    <path d="M340 205 C380 300, 380 380, 340 438" stroke="#b54b45" stroke-width="3" fill="none" marker-end="url(#djb)"/>
    <path d="M365 455 C450 420, 530 365, 570 335" stroke="#b54b45" stroke-width="3" fill="none" marker-end="url(#djb)"/>
    <path d="M570 315 L838 320" stroke="#b54b45" stroke-width="3" fill="none" marker-end="url(#djb)"/>

    <rect x="55" y="505" width="960" height="105" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="75" y="530" font-weight="700">最终距离（红色为最短路径树）</text>
    <text x="75" y="555">d(A)=0；d(B)=1；d(C)=min(4,1+2)=3；d(D)=min(1+5,3+1)=4；d(E)=4+3=7</text>
    <text x="75" y="579">路径：A→B→C→D→E，总权 1+2+1+3=7；每次确定一个最小距离点后不再改。</text>
    <text x="75" y="601" font-size="12" fill="#6b777f">前提：边权非负。负权边会让“已确定”失效，应使用 Bellman-Ford 等算法。</text>
  </g>
</svg>
