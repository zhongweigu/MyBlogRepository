<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-label="停等、回退N和选择重传的窗口与重传">
  <defs>
    <marker id="arqa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1080" height="760" fill="#fffdf8"/>
  <text x="540" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">停等、GBN、SR：窗口与重传范围</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <text x="45" y="75" font-weight="700">A. 停等：发送窗口=1，接收窗口=1</text>
    <rect x="55" y="95" width="110" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="110" y="120" text-anchor="middle">发送窗口</text>
    <rect x="180" y="95" width="110" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="235" y="120" text-anchor="middle">接收窗口</text>
    <text x="320" y="120">发 0 → 等 ACK0 → 发 1；超时重传，序号 1 位。</text>
    <text x="55" y="160" font-size="12" fill="#52605a">信道利用率 = T_D/(T_D+RTT+T_A)，RTT 大时很低。</text>

    <text x="45" y="210" font-weight="700">B. GBN：发送窗口&gt;1，接收窗口=1</text>
    <g>
      <rect x="55" y="230" width="70" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="90" y="255" text-anchor="middle">0</text>
      <rect x="125" y="230" width="70" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="160" y="255" text-anchor="middle">1</text>
      <rect x="195" y="230" width="70" height="38" fill="#f3e6e6" stroke="#a85a5a"/><text x="230" y="255" text-anchor="middle">2 丢</text>
      <rect x="265" y="230" width="70" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="300" y="255" text-anchor="middle">3</text>
    </g>
    <text x="500" y="255">发送方可连续发 0–3；2 丢失后，接收端丢弃 3。</text>
    <text x="500" y="280">超时后重传 2、3（回退 N）。</text>
    <text x="55" y="300" font-size="12" fill="#52605a">累积确认；n 位序号窗口 ≤ 2^n−1。</text>

    <text x="45" y="355" font-weight="700">C. SR：发送窗口&gt;1，接收窗口&gt;1</text>
    <g>
      <rect x="55" y="375" width="70" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="90" y="400" text-anchor="middle">0</text>
      <rect x="125" y="375" width="70" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="160" y="400" text-anchor="middle">1</text>
      <rect x="195" y="375" width="70" height="38" fill="#f3e6e6" stroke="#a85a5a"/><text x="230" y="400" text-anchor="middle">2 丢</text>
      <rect x="265" y="375" width="70" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="300" y="400" text-anchor="middle">3 缓存</text>
    </g>
    <text x="500" y="400">接收端缓存 3，只重传 2；2 到后一起交付。</text>
    <text x="500" y="425">逐帧确认；n 位序号窗口 ≤ 2^(n−1)。</text>

    <line x1="55" y1="470" x2="1020" y2="470" stroke="#c9c0ae"/>
    <text x="45" y="505" font-weight="700">窗口为什么受序号位数限制</text>
    <text x="45" y="530">序号空间只有 2^n 个；窗口过大时，新旧帧可能使用相同序号，接收端无法区分“新帧”和“重传旧帧”。</text>
    <text x="45" y="555">GBN：发送窗口 ≤ 2^n−1；SR：发送/接收窗口 ≤ 2^(n−1)。</text>

    <rect x="45" y="590" width="990" height="120" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="65" y="615" font-weight="700">选择</text>
    <text x="65" y="640" font-size="13">链路 RTT 大、误码率低、实现简单 → 停等/GBN；需要高利用率且能缓存乱序帧 → SR。</text>
    <text x="65" y="664" font-size="13">GBN 出错时重传一整段，浪费带宽；SR 只重传出错帧，但接收端要排序/缓存。</text>
    <text x="65" y="688" font-size="12" fill="#b54b45">“窗口越大越好”是错的：序号空间和缓存才是硬约束。</text>
  </g>
</svg>
