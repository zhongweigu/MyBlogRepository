<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" role="img" aria-label="CRC 发送端与接收端的模2除法">
  <defs>
    <marker id="crca" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="1060" height="620" fill="#fffdf8"/>
  <text x="530" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">CRC：发送端补零求余，接收端再除一次</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <rect x="45" y="80" width="460" height="210" rx="4" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="65" y="108" font-weight="700">发送端</text>
    <text x="65" y="138">① 数据 D 左移 r 位：D 后补 r 个 0</text>
    <text x="65" y="164">② 用生成多项式 G（r 次）做模 2 除法</text>
    <text x="65" y="190">③ 余数 R 就是 r 位 FCS</text>
    <text x="65" y="216">④ 发送 D + R</text>
    <text x="65" y="250" font-family="monospace" font-size="13">D 000…0 ÷ G = Q 余 R</text>
    <text x="65" y="275" font-size="12" fill="#52605a">模 2 除法 = 异或，不借位；r 是 G 的最高次数。</text>

    <rect x="555" y="80" width="460" height="210" rx="4" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="575" y="108" font-weight="700">接收端</text>
    <text x="575" y="138">① 收到 D + R</text>
    <text x="575" y="164">② 用同一个 G 做模 2 除法</text>
    <text x="575" y="190">③ 余数为 0 → 认为无错</text>
    <text x="575" y="216">④ 余数非 0 → 检测到错误</text>
    <text x="575" y="250" font-family="monospace" font-size="13">(D + R) ÷ G = Q 余 0</text>
    <text x="575" y="275" font-size="12" fill="#52605a">CRC 只检错；漏检概率低但非零。</text>

    <path d="M505 185 L555 185" stroke="#4d5b66" stroke-width="2" marker-end="url(#crca)"/>
    <text x="515" y="175" font-size="11">发送</text>

    <text x="45" y="345" font-weight="700">生成多项式的次数 r 决定什么</text>
    <text x="45" y="370">FCS 长度 = r 位；可检测所有长度 ≤ r 的突发错误。</text>
    <text x="45" y="394">若 G(x) 含 (x+1) 因子，可检测奇数个比特错误。</text>
    <text x="45" y="418" font-size="12" fill="#52605a">具体检错能力还取决于 G(x) 的选择；CRC 不是纠错码。</text>

    <rect x="45" y="455" width="970" height="70" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="65" y="480" font-weight="700">不要和奇偶校验混淆</text>
    <text x="65" y="502" font-size="13">奇偶校验只加 1 位，检测奇数个比特错；CRC 加 r 位，擅长检测突发错误，广泛用于帧尾 FCS。</text>

    <text x="45" y="565" font-weight="700">做题</text>
    <text x="45" y="590" font-size="13">先看 G 的次数 r，补 r 个 0；除法用异或；余数不足 r 位时左侧补 0；最后把余数替换到补的 0 上。</text>
    <text x="45" y="612" font-size="12" fill="#6b777f">若题目要求“接收端余数”，不要把发送端的余数直接当结果，要再把 D+R 除一遍。</text>
  </g>
</svg>
