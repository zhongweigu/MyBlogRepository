<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" role="img" aria-label="大小端字节序与结构体边界对齐布局">
  <rect width="1060" height="720" fill="#fffdf8"/>
  <text x="530" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">大小端与结构体边界对齐：地址、字节、填充</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="78" font-weight="700">A. 32 位数据 0x12345678 从 0x1000 开始</text>
    <text x="70" y="108" font-size="12" fill="#52605a">地址方向 → 递增；每个单元 1 字节</text>

    <text x="50" y="145">地址</text>
    <rect x="130" y="128" width="120" height="40" fill="#f7f5ee" stroke="#c9c0ae"/><text x="190" y="154" text-anchor="middle">0x1000</text>
    <rect x="250" y="128" width="120" height="40" fill="#f7f5ee" stroke="#c9c0ae"/><text x="310" y="154" text-anchor="middle">0x1001</text>
    <rect x="370" y="128" width="120" height="40" fill="#f7f5ee" stroke="#c9c0ae"/><text x="430" y="154" text-anchor="middle">0x1002</text>
    <rect x="490" y="128" width="120" height="40" fill="#f7f5ee" stroke="#c9c0ae"/><text x="550" y="154" text-anchor="middle">0x1003</text>

    <text x="50" y="196">大端</text>
    <rect x="130" y="175" width="120" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="190" y="201" text-anchor="middle">12</text>
    <rect x="250" y="175" width="120" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="310" y="201" text-anchor="middle">34</text>
    <rect x="370" y="175" width="120" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="430" y="201" text-anchor="middle">56</text>
    <rect x="490" y="175" width="120" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="550" y="201" text-anchor="middle">78</text>
    <text x="650" y="201" font-size="12">最高有效字节在最低地址</text>

    <text x="50" y="250">小端</text>
    <rect x="130" y="230" width="120" height="42" fill="#f7ecd9" stroke="#a8782c"/><text x="190" y="256" text-anchor="middle">78</text>
    <rect x="250" y="230" width="120" height="42" fill="#f7ecd9" stroke="#a8782c"/><text x="310" y="256" text-anchor="middle">56</text>
    <rect x="370" y="230" width="120" height="42" fill="#f7ecd9" stroke="#a8782c"/><text x="430" y="256" text-anchor="middle">34</text>
    <rect x="490" y="230" width="120" height="42" fill="#f7ecd9" stroke="#a8782c"/><text x="550" y="256" text-anchor="middle">12</text>
    <text x="650" y="256" font-size="12">最低有效字节在最低地址</text>

    <text x="45" y="325" font-weight="700">B. 结构体边界对齐（32 位模型：int 4B、short 2B、char 1B）</text>
    <text x="50" y="352" font-size="12" fill="#52605a">每一格 1 字节；P 表示填充（padding），成员必须从自身对齐倍数开始</text>

    <text x="50" y="390">struct A</text>
    <text x="140" y="390" font-size="12">{ int a; char b; short c; }</text>
    <g>
      <rect x="70" y="405" width="300" height="36" fill="#eef3e4" stroke="#6f8f45"/><text x="220" y="429" text-anchor="middle">int a（偏移 0–3）</text>
      <rect x="370" y="405" width="75" height="36" fill="#f3e6e6" stroke="#a85a5a"/><text x="407" y="429" text-anchor="middle">b</text>
      <rect x="445" y="405" width="75" height="36" fill="#e5e5e5" stroke="#9a9a9a"/><text x="482" y="429" text-anchor="middle">P</text>
      <rect x="520" y="405" width="150" height="36" fill="#e9f2f6" stroke="#4d7f95"/><text x="595" y="429" text-anchor="middle">short c（6–7）</text>
    </g>
    <text x="700" y="428" font-size="12">大小 8B（4 对齐）</text>

    <text x="50" y="480">struct B</text>
    <text x="140" y="480" font-size="12">{ char b; int a; short c; }</text>
    <g>
      <rect x="70" y="495" width="75" height="36" fill="#f3e6e6" stroke="#a85a5a"/><text x="107" y="519" text-anchor="middle">b</text>
      <rect x="145" y="495" width="225" height="36" fill="#e5e5e5" stroke="#9a9a9a"/><text x="257" y="519" text-anchor="middle">填充 1–3</text>
      <rect x="370" y="495" width="300" height="36" fill="#eef3e4" stroke="#6f8f45"/><text x="520" y="519" text-anchor="middle">int a（偏移 4–7）</text>
      <rect x="670" y="495" width="150" height="36" fill="#e9f2f6" stroke="#4d7f95"/><text x="745" y="519" text-anchor="middle">short c（8–9）</text>
      <rect x="820" y="495" width="150" height="36" fill="#e5e5e5" stroke="#9a9a9a"/><text x="895" y="519" text-anchor="middle">末尾填充 10–11</text>
    </g>
    <text x="70" y="560" font-size="12">大小 12B；最大对齐 4，末尾补到 4 的倍数</text>

    <text x="45" y="610" font-weight="700">判断口诀</text>
    <text x="45" y="636" font-size="13">大小端：只看多字节数据的字节排列；字节内部的 0/1 顺序不变。</text>
    <text x="45" y="660" font-size="13">对齐：成员起点 = 自身大小的整数倍；结构体总大小 = 最大对齐要求的整数倍。</text>
    <text x="45" y="684" font-size="12" fill="#6b777f">偏移/大小按 32 位自然对齐模型；题目若指定 pack 或不同 ABI，以题目参数为准。</text>
  </g>
</svg>
