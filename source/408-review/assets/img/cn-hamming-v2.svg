<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-label="海明距离与检错纠错能力">
  <rect width="1060" height="560" fill="#fffdf8"/>
  <text x="530" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">海明距离：两个码字之间至少差几位</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="80" font-weight="700">两个码字的距离</text>
    <text x="45" y="108" font-family="monospace">A = 0 0 1 0 1 1 0 1</text>
    <text x="45" y="132" font-family="monospace">B = 1 1 0 1 0 0 1 0</text>
    <text x="45" y="156" font-size="13">逐位比较，8 位全不同，所以 d(A,B)=8。</text>

    <line x1="180" y1="215" x2="880" y2="215" stroke="#4d5b66" stroke-width="2"/>
    <circle cx="200" cy="215" r="7" fill="#3f6f8a"/>
    <circle cx="860" cy="215" r="7" fill="#6f8f45"/>
    <text x="200" y="195" text-anchor="middle">A</text>
    <text x="860" y="195" text-anchor="middle">B</text>
    <text x="530" y="195" text-anchor="middle">距离 = 至少翻转的位数</text>
    <path d="M210 230 L850 230" stroke="#b54b45" stroke-width="2"/>
    <text x="530" y="250" text-anchor="middle" fill="#b54b45">d0 是“所有合法码字对”里最小的距离</text>

    <text x="45" y="300" font-weight="700">d0 与检错/纠错能力</text>
    <g font-size="13">
      <rect x="45" y="315" width="970" height="36" fill="#eef3e4" stroke="#6f8f45"/>
      <text x="60" y="338">d0=1：不能检错；d0=2：可检 1 位，不能纠；d0=3：可检 2 位，或纠 1 位；</text>
      <text x="60" y="372">d0=4：可检 3 位，或纠 1 位，也可“检 2 位 + 纠 1 位”；d0=5：可纠 2 位。</text>
    </g>

    <rect x="45" y="405" width="970" height="100" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="65" y="430" font-weight="700">三个公式</text>
    <text x="65" y="455" font-size="16" font-family="serif">检测 e 位：d0 ≥ e+1　　纠正 t 位：d0 ≥ 2t+1　　检 e 纠 t（e≥t）：d0 ≥ e+t+1</text>
    <text x="65" y="480" font-size="12" fill="#52605a">d0=3 时：能纠 1 位（2×1+1=3），能检 2 位（2+1=3）；但不能同时检 2 纠 1（2+1+1=4&gt;3）。</text>
    <text x="65" y="500" font-size="12" fill="#52605a">d0=4 时：纠 1 位仍满足；同时检 2 纠 1 也满足（2+1+1=4）。</text>

    <text x="45" y="540" font-size="12" fill="#6b777f">记法：先看“最多能容忍几位错”，再用三个不等式反推 d0；不要只背“d0 越大越强”。</text>
  </g>
</svg>
