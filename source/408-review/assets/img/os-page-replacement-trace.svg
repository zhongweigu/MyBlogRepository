<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-label="FIFO 与 LRU 页面置换轨迹">
  <rect width="1080" height="640" fill="#fffdf8"/>
  <text x="540" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">同一访问串，FIFO 与 LRU 的 victim 选择不同</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="72">访问串：1, 2, 3, 1, 4, 2；页框数 = 3（初始为空）</text>
    <text x="45" y="96" font-size="12" fill="#52605a">每次访问后写出三个页框的内容；H=命中，M=缺页。</text>

    <text x="45" y="145" font-weight="700">FIFO：淘汰最早进入的页</text>
    <g>
      <rect x="45" y="165" width="90" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="90" y="191" text-anchor="middle">1</text>
      <rect x="135" y="165" width="90" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="180" y="191" text-anchor="middle">2</text>
      <rect x="225" y="165" width="90" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="270" y="191" text-anchor="middle">3</text>
      <rect x="315" y="165" width="90" height="42" fill="#eef3e4" stroke="#6f8f45"/><text x="360" y="191" text-anchor="middle">1(H)</text>
      <rect x="405" y="165" width="90" height="42" fill="#f3e6e6" stroke="#a85a5a"/><text x="450" y="191" text-anchor="middle">4(M)</text>
      <rect x="495" y="165" width="90" height="42" fill="#eef3e4" stroke="#6f8f45"/><text x="540" y="191" text-anchor="middle">2(H)</text>
    </g>
    <text x="45" y="235">页框：[1] → [1,2] → [1,2,3] → [1,2,3] → [2,3,4] → [2,3,4]</text>
    <text x="45" y="258" fill="#b54b45">缺页 4 次；4 到达时淘汰 1（最早进入）。</text>

    <text x="45" y="315" font-weight="700">LRU：淘汰最久未使用的页</text>
    <g>
      <rect x="45" y="335" width="90" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="90" y="361" text-anchor="middle">1</text>
      <rect x="135" y="335" width="90" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="180" y="361" text-anchor="middle">2</text>
      <rect x="225" y="335" width="90" height="42" fill="#e9f2f6" stroke="#4d7f95"/><text x="270" y="361" text-anchor="middle">3</text>
      <rect x="315" y="335" width="90" height="42" fill="#eef3e4" stroke="#6f8f45"/><text x="360" y="361" text-anchor="middle">1(H)</text>
      <rect x="405" y="335" width="90" height="42" fill="#f3e6e6" stroke="#a85a5a"/><text x="450" y="361" text-anchor="middle">4(M)</text>
      <rect x="495" y="335" width="90" height="42" fill="#f3e6e6" stroke="#a85a5a"/><text x="540" y="361" text-anchor="middle">2(M)</text>
    </g>
    <text x="45" y="405">页框：[1] → [1,2] → [1,2,3] → [2,3,1] → [3,1,4] → [1,4,2]</text>
    <text x="45" y="428" fill="#b54b45">缺页 5 次；4 到达时淘汰 2（最久未使用），2 再访问时又缺页。</text>

    <rect x="650" y="145" width="380" height="200" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="670" y="170" font-weight="700">CLOCK：LRU 的近似实现</text>
    <text x="670" y="195" font-size="13">每个页框一个访问位；命中置 1。</text>
    <text x="670" y="218" font-size="13">缺页时从指针开始扫描：</text>
    <text x="670" y="241" font-size="13">访问位=1 → 清 0，跳过；</text>
    <text x="670" y="264" font-size="13">访问位=0 → 选中淘汰。</text>
    <text x="670" y="287" font-size="13">指针循环移动，像钟面一样。</text>
    <text x="670" y="315" font-size="12" fill="#52605a">它不记录精确时间，只用一位近似“最近是否用过”。</text>

    <rect x="45" y="480" width="985" height="100" rx="4" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="65" y="506" font-weight="700">读图关键</text>
    <text x="65" y="530">FIFO 只看“进入时间”，不看最近是否访问；LRU 看“最近使用时间”。</text>
    <text x="65" y="554">命中时，LRU 要更新该页的“最近使用”顺序；FIFO 不改变队列位置（除非实现成第二次机会）。</text>
    <text x="65" y="574" font-size="12" fill="#6b777f">同一访问串的结果取决于初始状态和实现细节；考试按题目给出的页框初态和算法定义模拟。</text>
  </g>
</svg>
