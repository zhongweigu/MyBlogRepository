<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="t d">
<title id="t">海明码 7 位位置与三组校验</title>
<desc id="d">7 位海明码中，1、2、4 位是校验位，3、5、6、7 位是数据位；P1 覆盖 1、3、5、7，P2 覆盖 2、3、6、7，P4 覆盖 4、5、6、7。</desc>
<style>.n{fill:#f7fafc;stroke:#35618f;stroke-width:1.5;rx:5}.p{fill:#fff7ed;stroke:#b45309;stroke-width:1.7;rx:5}.d{fill:#eef7ee;stroke:#4d7c4d;stroke-width:1.7;rx:5}.t{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#1f2937;text-anchor:middle}.s{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:11px;fill:#5b6573;text-anchor:middle}.l{stroke:#35618f;stroke-width:1.5;fill:none}</style>
<rect width="880" height="330" fill="#fff"/>
<text class="t" x="440" y="28">海明码（7,4）：校验位在 1、2、4 位</text>
<g>
<rect class="p" x="80" y="55" width="70" height="50"/><text class="t" x="115" y="85">P1</text><text class="s" x="115" y="120">位1</text>
<rect class="p" x="170" y="55" width="70" height="50"/><text class="t" x="205" y="85">P2</text><text class="s" x="205" y="120">位2</text>
<rect class="d" x="260" y="55" width="70" height="50"/><text class="t" x="295" y="85">D3</text><text class="s" x="295" y="120">位3</text>
<rect class="p" x="350" y="55" width="70" height="50"/><text class="t" x="385" y="85">P4</text><text class="s" x="385" y="120">位4</text>
<rect class="d" x="440" y="55" width="70" height="50"/><text class="t" x="475" y="85">D5</text><text class="s" x="475" y="120">位5</text>
<rect class="d" x="530" y="55" width="70" height="50"/><text class="t" x="565" y="85">D6</text><text class="s" x="565" y="120">位6</text>
<rect class="d" x="620" y="55" width="70" height="50"/><text class="t" x="655" y="85">D7</text><text class="s" x="655" y="120">位7</text>
</g>
<rect class="n" x="60" y="160" width="680" height="35"/><text class="t" x="400" y="183">P1：1、3、5、7　　P2：2、3、6、7　　P4：4、5、6、7</text>
<text class="s" x="440" y="230">故障字 = G4 G2 G1，非 0 的十进制值就是出错位号</text>
<text class="s" x="440" y="255">例：第 6 位翻转 → G1=0，G2=1，G4=1 → 110₂=6</text>
<text class="s" x="440" y="285">P 为校验位（橙），D 为数据位（绿）</text>
</svg>
