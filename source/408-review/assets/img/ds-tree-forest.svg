<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="树转换为二叉树：左孩子右兄弟">
  <rect width="1000" height="460" fill="#fffdf8"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="70" y="44" fill="#1b2425" font-size="20" font-weight="700">树</text>
    <text x="545" y="44" fill="#1b2425" font-size="20" font-weight="700">转换后的二叉树</text>

    <!-- tree edges -->
    <g stroke="#68736f" stroke-width="1.4">
      <line x1="200" y1="110" x2="120" y2="210"/>
      <line x1="200" y1="110" x2="200" y2="210"/>
      <line x1="200" y1="110" x2="280" y2="210"/>
      <line x1="120" y1="210" x2="80" y2="320"/>
    </g>
    <!-- tree nodes -->
    <g>
      <circle cx="200" cy="90" r="28" fill="#0d6b60" stroke="#084f47" stroke-width="1.5"/>
      <text x="200" y="97" fill="#fff" font-size="17" text-anchor="middle" font-weight="700">A</text>
      <circle cx="120" cy="230" r="28" fill="#fff" stroke="#0d6b60" stroke-width="1.5"/>
      <text x="120" y="237" fill="#1b2425" font-size="17" text-anchor="middle">B</text>
      <circle cx="200" cy="230" r="28" fill="#fff" stroke="#0d6b60" stroke-width="1.5"/>
      <text x="200" y="237" fill="#1b2425" font-size="17" text-anchor="middle">C</text>
      <circle cx="280" cy="230" r="28" fill="#fff" stroke="#0d6b60" stroke-width="1.5"/>
      <text x="280" y="237" fill="#1b2425" font-size="17" text-anchor="middle">D</text>
      <circle cx="80" cy="340" r="28" fill="#fff" stroke="#0d6b60" stroke-width="1.5"/>
      <text x="80" y="347" fill="#1b2425" font-size="17" text-anchor="middle">E</text>
    </g>
    <text x="55" y="400" fill="#68736f" font-size="11">A 的孩子：B、C、D；B 的孩子：E</text>

    <!-- binary edges: A-B, B-C, C-D, B-E, D-NIL -->
    <g stroke="#a75a1f" stroke-width="1.5">
      <line x1="700" y1="110" x2="620" y2="210"/>
      <line x1="620" y1="230" x2="760" y2="210"/>
      <line x1="760" y1="230" x2="880" y2="210"/>
      <line x1="620" y1="210" x2="540" y2="310"/>
      <line x1="880" y1="230" x2="960" y2="310"/>
    </g>
    <!-- binary nodes -->
    <g>
      <circle cx="700" cy="90" r="28" fill="#a75a1f" stroke="#7c3f12" stroke-width="1.5"/>
      <text x="700" y="97" fill="#fff" font-size="17" text-anchor="middle" font-weight="700">A</text>
      <circle cx="620" cy="230" r="28" fill="#fff" stroke="#a75a1f" stroke-width="1.5"/>
      <text x="620" y="237" fill="#1b2425" font-size="17" text-anchor="middle">B</text>
      <circle cx="760" cy="230" r="28" fill="#fff" stroke="#a75a1f" stroke-width="1.5"/>
      <text x="760" y="237" fill="#1b2425" font-size="17" text-anchor="middle">C</text>
      <circle cx="880" cy="230" r="28" fill="#fff" stroke="#a75a1f" stroke-width="1.5"/>
      <text x="880" y="237" fill="#1b2425" font-size="17" text-anchor="middle">D</text>
      <circle cx="540" cy="330" r="28" fill="#fff" stroke="#a75a1f" stroke-width="1.5"/>
      <text x="540" y="337" fill="#1b2425" font-size="17" text-anchor="middle">E</text>
      <circle cx="960" cy="330" r="28" fill="#fff" stroke="#a75a1f" stroke-width="1.5"/>
      <text x="960" y="337" fill="#68736f" font-size="13" text-anchor="middle">NIL</text>
    </g>
    <text x="545" y="390" fill="#68736f" font-size="12">A 的左孩子是 B；B 的右孩子是 C；</text>
    <text x="545" y="414" fill="#68736f" font-size="12">C 的右孩子是 D；B 的左孩子是 E。</text>
    <text x="545" y="438" fill="#68736f" font-size="12">树的后根遍历 = 转换后二叉树的中序遍历。</text>
  </g>
</svg>
