<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="I/O 系统五层结构">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="760" height="430" fill="#fffdf8"/>
  <text x="380" y="30" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="#24313a">I/O 系统的五个层次</text>
  <g font-family="sans-serif" font-size="16">
    <rect x="190" y="58" width="380" height="50" rx="4" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="380" y="89" text-anchor="middle" fill="#24313a">用户层软件 · read/write/printf</text>

    <rect x="190" y="118" width="380" height="54" rx="4" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="380" y="141" text-anchor="middle" fill="#24313a">设备独立性软件</text>
    <text x="380" y="161" text-anchor="middle" font-size="12" fill="#52605a">统一接口 · 设备分配 · 缓冲 · 保护 · LUT</text>

    <rect x="190" y="182" width="380" height="54" rx="4" fill="#f7ecd9" stroke="#a8782c"/>
    <text x="380" y="205" text-anchor="middle" fill="#24313a">设备驱动程序</text>
    <text x="380" y="225" text-anchor="middle" font-size="12" fill="#52605a">翻译命令 · 设置控制器 · 启动设备 · 处理队列</text>

    <rect x="190" y="246" width="380" height="54" rx="4" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="380" y="269" text-anchor="middle" fill="#24313a">中断处理程序</text>
    <text x="380" y="289" text-anchor="middle" font-size="12" fill="#52605a">保存现场 · 查中断向量 · ISR · 唤醒/返回</text>

    <rect x="190" y="310" width="380" height="50" rx="4" fill="#e9e9e9" stroke="#6b6b6b"/>
    <text x="380" y="341" text-anchor="middle" fill="#24313a">硬件 · 设备/控制器/端口/总线/DMA</text>
  </g>
  <g stroke="#4d5b66" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M180 82 L180 335"/>
    <path d="M580 335 L580 82"/>
  </g>
  <text x="145" y="210" font-family="sans-serif" font-size="13" fill="#4d5b66" transform="rotate(-90 145 210)">请求向下翻译</text>
  <text x="625" y="210" font-family="sans-serif" font-size="13" fill="#4d5b66" transform="rotate(90 625 210)">完成/错误向上返回</text>
</svg>
