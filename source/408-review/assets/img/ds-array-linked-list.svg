<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="顺序表与单链表的结构对比">
  <rect width="1000" height="380" fill="#fffdf8"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="50" y="46" fill="#1b2425" font-size="20" font-weight="700">顺序表：连续存放</text>
    <text x="540" y="46" fill="#1b2425" font-size="20" font-weight="700">单链表：指针串联</text>

    <!-- array -->
    <g>
      <rect x="50" y="92" width="420" height="58" rx="8" fill="#edf6f2" stroke="#0d6b60" stroke-width="1.5"/>
      <g fill="#0d6b60" font-size="18" text-anchor="middle">
        <text x="85" y="130">12</text><text x="155" y="130">7</text><text x="225" y="130">25</text><text x="295" y="130">3</text><text x="365" y="130">18</text><text x="435" y="130">9</text>
      </g>
      <g stroke="#0d6b60" stroke-width="1">
        <line x1="120" y1="92" x2="120" y2="150"/><line x1="190" y1="92" x2="190" y2="150"/><line x1="260" y1="92" x2="260" y2="150"/><line x1="330" y1="92" x2="330" y2="150"/><line x1="400" y1="92" x2="400" y2="150"/>
      </g>
      <g fill="#68736f" font-size="11" text-anchor="middle">
        <text x="85" y="168">base+0</text><text x="155" y="168">+1</text><text x="225" y="168">+2</text><text x="295" y="168">+3</text><text x="365" y="168">+4</text><text x="435" y="168">+5</text>
      </g>
      <text x="65" y="210" fill="#4d5a59" font-size="13">按下标直接算地址：a[i] = base + i × L</text>
      <text x="65" y="234" fill="#a75a1f" font-size="13">插入 / 删除平均移动 n/2 个元素</text>
    </g>

    <!-- linked list -->
    <g>
      <g>
        <rect x="540" y="90" width="120" height="56" rx="7" fill="#fff" stroke="#0d6b60" stroke-width="1.5"/>
        <line x1="612" y1="90" x2="612" y2="146" stroke="#0d6b60"/>
        <text x="576" y="125" fill="#1b2425" font-size="17" text-anchor="middle">12</text>
        <text x="636" y="125" fill="#0d6b60" font-size="14" text-anchor="middle">→</text>
      </g>
      <g>
        <rect x="700" y="90" width="120" height="56" rx="7" fill="#fff" stroke="#0d6b60" stroke-width="1.5"/>
        <line x1="772" y1="90" x2="772" y2="146" stroke="#0d6b60"/>
        <text x="736" y="125" fill="#1b2425" font-size="17" text-anchor="middle">7</text>
        <text x="796" y="125" fill="#0d6b60" font-size="14" text-anchor="middle">→</text>
      </g>
      <g>
        <rect x="860" y="90" width="100" height="56" rx="7" fill="#fff" stroke="#0d6b60" stroke-width="1.5"/>
        <line x1="932" y1="90" x2="932" y2="146" stroke="#0d6b60"/>
        <text x="896" y="125" fill="#1b2425" font-size="17" text-anchor="middle">25</text>
        <text x="947" y="125" fill="#68736f" font-size="12" text-anchor="middle">^</text>
      </g>
      <g stroke="#0d6b60" stroke-width="1.5" fill="none" marker-end="url(#arr)">
        <line x1="660" y1="118" x2="696" y2="118"/>
        <line x1="820" y1="118" x2="856" y2="118"/>
      </g>
      <text x="540" y="210" fill="#4d5a59" font-size="13">按位查找要走路：O(n)</text>
      <text x="540" y="234" fill="#a75a1f" font-size="13">已知前驱时，插入 / 删除只改指针：O(1)</text>
      <text x="540" y="258" fill="#68736f" font-size="11">每个结点多存一个 next 指针</text>
    </g>

    <line x1="500" y1="70" x2="500" y2="300" stroke="#ded7c8" stroke-dasharray="4 5"/>
    <text x="50" y="330" fill="#68736f" font-size="12">选择依据：查多改少用顺序表；插删频繁、空间要离散用链表。</text>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d6b60"/>
    </marker>
  </defs>
</svg>
