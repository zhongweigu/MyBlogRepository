<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="指令周期的五个阶段与中断分支">
  <rect width="1100" height="440" fill="#fffdf8"/>
  <g font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="40" fill="#b54634" font-size="12" font-weight="800" letter-spacing="2">INSTRUCTION CYCLE · 流程</text>
    <text x="40" y="72" fill="#1f2328" font-size="24" font-weight="700">一条指令从取指到写回</text>

    <rect x="40" y="115" width="170" height="80" fill="#1f2328"/>
    <text x="125" y="145" fill="#fffdf8" font-size="15" text-anchor="middle">取指 IF</text>
    <text x="125" y="166" fill="#d9d2c4" font-size="9" text-anchor="middle">PC→MAR, Read</text>
    <text x="125" y="182" fill="#d9d2c4" font-size="9" text-anchor="middle">M→MDR→IR, PC+1</text>

    <line x1="210" y1="155" x2="250" y2="155" stroke="#1f2328" stroke-width="1.3" marker-end="url(#a)"/>
    <rect x="255" y="115" width="170" height="80" fill="#e8f2ef" stroke="#14756f"/>
    <text x="340" y="145" fill="#1f2328" font-size="15" text-anchor="middle">译码 ID</text>
    <text x="340" y="166" fill="#667078" font-size="9" text-anchor="middle">IR 操作码 → 控制单元</text>
    <text x="340" y="182" fill="#667078" font-size="9" text-anchor="middle">读寄存器 / 算地址</text>

    <line x1="425" y1="155" x2="465" y2="155" stroke="#14756f" stroke-width="1.3" marker-end="url(#b)"/>
    <rect x="470" y="115" width="170" height="80" fill="#fbf4ea" stroke="#a9651f"/>
    <text x="555" y="145" fill="#1f2328" font-size="15" text-anchor="middle">执行 EX</text>
    <text x="555" y="166" fill="#667078" font-size="9" text-anchor="middle">ALU 运算 / 算分支目标</text>
    <text x="555" y="182" fill="#667078" font-size="9" text-anchor="middle">设置 FR 标志</text>

    <line x1="640" y1="155" x2="680" y2="155" stroke="#a9651f" stroke-width="1.3" marker-end="url(#c)"/>
    <rect x="685" y="115" width="170" height="80" fill="#eef2f8" stroke="#355f91"/>
    <text x="770" y="145" fill="#1f2328" font-size="15" text-anchor="middle">访存 MEM</text>
    <text x="770" y="166" fill="#667078" font-size="9" text-anchor="middle">load / store / 取指</text>
    <text x="770" y="182" fill="#667078" font-size="9" text-anchor="middle">MAR / MDR / Read/Write</text>

    <line x1="855" y1="155" x2="895" y2="155" stroke="#355f91" stroke-width="1.3" marker-end="url(#d)"/>
    <rect x="900" y="115" width="160" height="80" fill="#f8f2e7" stroke="#1f2328"/>
    <text x="980" y="145" fill="#1f2328" font-size="15" text-anchor="middle">写回 WB</text>
    <text x="980" y="166" fill="#667078" font-size="9" text-anchor="middle">结果写寄存器</text>
    <text x="980" y="182" fill="#667078" font-size="9" text-anchor="middle">或写回 PC</text>

    <path d="M980 195 L980 250 L130 250 L130 198" fill="none" stroke="#b54634" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#e)"/>
    <text x="500" y="270" fill="#b54634" font-size="11" text-anchor="middle">取下一条指令：循环</text>

    <rect x="40" y="300" width="500" height="105" fill="#fff8f4" stroke="#b54634"/>
    <text x="58" y="326" fill="#b54634" font-size="11" font-weight="700">中断分支</text>
    <text x="58" y="350" fill="#1f2328" font-size="10.5">每条指令执行结束前检查中断请求；有请求且允许中断，就进入中断周期。</text>
    <text x="58" y="372" fill="#1f2328" font-size="10.5">中断周期：关中断、保存断点 / PSW、送中断服务程序入口。</text>
    <text x="58" y="394" fill="#667078" font-size="9.5">中断隐指令由硬件完成，不是程序里的一条机器指令。</text>

    <rect x="565" y="300" width="495" height="105" fill="#f8f2e7" stroke="#d9d2c4"/>
    <text x="583" y="326" fill="#b54634" font-size="11" font-weight="700">读图要点</text>
    <text x="583" y="350" fill="#1f2328" font-size="10.5">每一阶段都在“状态元件 → 组合逻辑 → 状态元件”之间走一遍；</text>
    <text x="583" y="372" fill="#1f2328" font-size="10.5">单总线每拍只能有一个输出源，阶段内部还要继续拆时钟拍。</text>
    <text x="583" y="394" fill="#667078" font-size="9.5">流水线就是把 IF/ID/EX/MEM/WB 重叠起来。</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1f2328"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14756f"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a9651f"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#355f91"/></marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b54634"/></marker>
  </defs>
</svg>
