<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-label="VFS 四个对象与进程 fd 表、磁盘 inode 的关系">
  <defs>
    <marker id="va" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
    <marker id="vb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1160" height="760" fill="#fffdf8"/>
  <text x="580" y="34" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">VFS 四个对象：谁在内存、谁指向谁、谁在磁盘</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <rect x="30" y="62" width="1100" height="420" rx="5" fill="#f7fbfd" stroke="#8fb3c4" stroke-dasharray="7 5"/>
    <text x="50" y="88" font-size="13" font-weight="700" fill="#35618f">内核内存（VFS 对象只在这里）</text>

    <rect x="55" y="115" width="180" height="110" rx="4" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="145" y="139" text-anchor="middle" font-weight="700">进程 P1</text>
    <text x="145" y="160" text-anchor="middle" font-size="12">fd 表（进程私有）</text>
    <text x="145" y="182" text-anchor="middle" font-size="12">fd=3 → file A</text>
    <text x="145" y="202" text-anchor="middle" font-size="12">（只有 fd3 打开 a.txt）</text>

    <rect x="55" y="260" width="180" height="84" rx="4" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="145" y="284" text-anchor="middle" font-weight="700">进程 P2</text>
    <text x="145" y="305" text-anchor="middle" font-size="12">fd 表（另一张）</text>
    <text x="145" y="326" text-anchor="middle" font-size="12">fd=5 → file C</text>

    <rect x="300" y="110" width="225" height="92" rx="4" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="412" y="134" text-anchor="middle" font-weight="700">file 对象 A</text>
    <text x="412" y="155" text-anchor="middle" font-size="12">本次打开：偏移 0、O_RDONLY</text>
    <text x="412" y="174" text-anchor="middle" font-size="12">引用计数 1</text>
    <text x="412" y="193" text-anchor="middle" font-size="12">→ dentry / vnode</text>

    <rect x="300" y="245" width="225" height="92" rx="4" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="412" y="269" text-anchor="middle" font-weight="700">file 对象 C</text>
    <text x="412" y="290" text-anchor="middle" font-size="12">另一次 open：偏移 128</text>
    <text x="412" y="309" text-anchor="middle" font-size="12">引用计数 1</text>
    <text x="412" y="328" text-anchor="middle" font-size="12">→ dentry / vnode</text>

    <rect x="610" y="150" width="190" height="115" rx="4" fill="#f7ecd9" stroke="#a8782c"/>
    <text x="705" y="174" text-anchor="middle" font-weight="700">dentry</text>
    <text x="705" y="195" text-anchor="middle" font-size="12">名字 "a.txt"</text>
    <text x="705" y="214" text-anchor="middle" font-size="12">父目录 / 子项</text>
    <text x="705" y="233" text-anchor="middle" font-size="12">路径解析时建立/缓存</text>
    <text x="705" y="252" text-anchor="middle" font-size="12">→ vnode</text>

    <rect x="865" y="120" width="230" height="125" rx="4" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="980" y="144" text-anchor="middle" font-weight="700">vnode / VFS inode</text>
    <text x="980" y="165" text-anchor="middle" font-size="12">统一类型、权限、大小、时间</text>
    <text x="980" y="184" text-anchor="middle" font-size="12">操作函数指针</text>
    <text x="980" y="203" text-anchor="middle" font-size="12">i_sb → superblock</text>
    <text x="980" y="222" text-anchor="middle" font-size="12">i_private → 具体 inode</text>

    <rect x="865" y="310" width="230" height="118" rx="4" fill="#eadff2" stroke="#7f5b9a"/>
    <text x="980" y="334" text-anchor="middle" font-weight="700">superblock</text>
    <text x="980" y="355" text-anchor="middle" font-size="12">一个已挂载的文件系统</text>
    <text x="980" y="374" text-anchor="middle" font-size="12">块大小、总块数、空闲块</text>
    <text x="980" y="393" text-anchor="middle" font-size="12">文件系统类型、操作表</text>
    <text x="980" y="412" text-anchor="middle" font-size="12">挂载时建立/读入</text>

    <path d="M235 170 L300 156" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#va)"/>
    <path d="M235 318 L300 290" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#va)"/>
    <path d="M525 156 C570 156, 570 190, 610 195" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#va)"/>
    <path d="M525 290 C570 290, 570 230, 610 210" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#va)"/>
    <path d="M800 200 L865 185" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#va)"/>
    <path d="M980 245 L980 310" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#va)"/>

    <text x="52" y="390" font-size="12" fill="#52605a">P1 fd3 与 P2 fd5 是两次独立 open：两个 file 对象、各自偏移，但共享同一个 dentry/vnode。</text>
    <text x="52" y="412" font-size="12" fill="#52605a">若 fork/dup 让两个 fd 指向同一个 file，则它们共享偏移；这是“打开实例”层的共享。</text>

    <rect x="30" y="505" width="1100" height="210" rx="5" fill="#fbf8f1" stroke="#c9c0ae" stroke-dasharray="7 5"/>
    <text x="50" y="531" font-size="13" font-weight="700" fill="#8a6a35">磁盘 / 具体文件系统</text>

    <rect x="300" y="555" width="260" height="78" rx="4" fill="#e5e5e5" stroke="#8f8f8f"/>
    <text x="430" y="579" text-anchor="middle" font-weight="700">具体文件系统 inode / MFT</text>
    <text x="430" y="600" text-anchor="middle" font-size="12">ext4 inode、NTFS MFT 记录…</text>
    <text x="430" y="619" text-anchor="middle" font-size="12">保存磁盘块指针/属性</text>

    <rect x="680" y="555" width="260" height="78" rx="4" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="810" y="579" text-anchor="middle" font-weight="700">数据块</text>
    <text x="810" y="600" text-anchor="middle" font-size="12">文件正文 / 目录内容</text>
    <text x="810" y="619" text-anchor="middle" font-size="12">按具体 FS 的块号访问</text>

    <path d="M980 245 C980 500, 560 510, 430 555" stroke="#b54b45" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#vb)"/>
    <text x="600" y="490" fill="#b54b45" font-size="12">i_private / 具体 inode 指针（跨层）</text>
    <path d="M560 594 L680 594" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#va)"/>
    <text x="590" y="584" font-size="12">数据块指针</text>

    <text x="50" y="680" font-size="12" fill="#6b777f">记忆：superblock 管“哪个文件系统”，vnode 管“哪个文件”，dentry 管“路径中的哪个名字”，file 管“这次打开”。</text>
    <text x="50" y="703" font-size="12" fill="#6b777f">dentry/vnode 可在多个 file 之间共享；file 的偏移按打开实例独立。</text>
  </g>
</svg>
