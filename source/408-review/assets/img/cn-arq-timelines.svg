<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="停止等待、GBN、SR 的数据传输与重传时序">
  <defs>
    <marker id="tma" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#3f6f8a"/></marker>
    <marker id="tmr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#fffdf8"/>
  <text x="600" y="30" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">三种 ARQ 的时序：确认、丢帧、重传与乱序缓存</text>
  <g font-family="sans-serif" font-size="12" fill="#24313a">
    <!-- A stop and wait -->
    <text x="40" y="65" font-weight="700">A. 停止等待：丢数据帧 / 丢 ACK</text>
    <line x1="140" y1="85" x2="140" y2="285" stroke="#3f6f8a"/>
    <line x1="720" y1="85" x2="720" y2="285" stroke="#3f6f8a"/>
    <text x="140" y="78" text-anchor="middle">发送方</text><text x="720" y="78" text-anchor="middle">接收方</text>

    <path d="M145 105 L715 125" stroke="#3f6f8a" stroke-width="1.6" marker-end="url(#tma)"/><text x="400" y="110" font-size="11">数据 0</text>
    <path d="M715 145 L145 165" stroke="#3f6f8a" stroke-width="1.6" marker-end="url(#tma)"/><text x="400" y="155" font-size="11">ACK0</text>
    <path d="M145 185 L300 190" stroke="#b54b45" stroke-width="1.6" stroke-dasharray="4 3"/><text x="200" y="180" fill="#b54b45" font-size="11">数据 1 丢失</text>
    <path d="M145 210 L715 230" stroke="#b54b45" stroke-width="1.6" marker-end="url(#tmr)"/><text x="400" y="218" fill="#b54b45" font-size="11">超时重传数据 1</text>
    <path d="M715 245 L145 265" stroke="#3f6f8a" stroke-width="1.6" marker-end="url(#tma)"/><text x="400" y="258" font-size="11">ACK1</text>
    <text x="800" y="120" font-size="11" fill="#52605a">数据丢失：发送方计时器超时，自动重传。</text>
    <text x="800" y="145" font-size="11" fill="#52605a">ACK 丢失：发送方也会超时重传；接收方收到重复帧后丢弃，并重发 ACK。</text>
    <text x="800" y="170" font-size="11" fill="#52605a">序号只需 1bit：0/1 区分新帧与重复帧。</text>

    <!-- B GBN -->
    <line x1="40" y1="315" x2="1160" y2="315" stroke="#e1d8c8"/>
    <text x="40" y="345" font-weight="700">B. GBN：接收窗口=1，累积确认，出错回退</text>
    <line x1="140" y1="365" x2="140" y2="585" stroke="#3f6f8a"/>
    <line x1="720" y1="365" x2="720" y2="585" stroke="#3f6f8a"/>
    <text x="140" y="358" text-anchor="middle">发送方</text><text x="720" y="358" text-anchor="middle">接收方</text>

    <path d="M145 380 L715 395" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="385" font-size="10">数据0</text>
    <path d="M145 405 L715 420" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="410" font-size="10">数据1</text>
    <path d="M145 430 L330 432" stroke="#b54b45" stroke-width="1.5" stroke-dasharray="4 3"/><text x="215" y="425" fill="#b54b45" font-size="10">数据2丢失</text>
    <path d="M145 455 L715 470" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="460" font-size="10">数据3（接收方丢弃）</text>
    <path d="M715 490 L145 505" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="495" font-size="10">ACK1（累积确认0、1）</text>
    <path d="M145 525 L715 540" stroke="#b54b45" stroke-width="1.5" marker-end="url(#tmr)"/><text x="400" y="530" fill="#b54b45" font-size="10">2超时：重传2、3</text>
    <path d="M715 560 L145 575" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="568" font-size="10">ACK3</text>
    <text x="800" y="390" font-size="11" fill="#52605a">发送窗口可连续发 0、1、2、3；接收窗口只有 1，只按序收。</text>
    <text x="800" y="415" font-size="11" fill="#52605a">通常只为最早未确认帧设一个计时器；它超时，重传它及之后所有已发送未确认帧。</text>
    <text x="800" y="440" font-size="11" fill="#52605a">累积确认：ACK1 表示 0、1 都收到；重复 ACK1 催促发送方重传。</text>
    <text x="800" y="465" font-size="11" fill="#52605a">n 位序号：W_T≤2^n−1。</text>

    <!-- C SR -->
    <line x1="40" y1="615" x2="1160" y2="615" stroke="#e1d8c8"/>
    <text x="40" y="645" font-weight="700">C. SR：只重传出错帧，接收方缓存乱序帧，可回 NAK</text>
    <line x1="140" y1="665" x2="140" y2="870" stroke="#3f6f8a"/>
    <line x1="720" y1="665" x2="720" y2="870" stroke="#3f6f8a"/>
    <text x="140" y="658" text-anchor="middle">发送方</text><text x="720" y="658" text-anchor="middle">接收方</text>

    <path d="M145 680 L715 692" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="684" font-size="10">数据0</text>
    <path d="M145 705 L715 717" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="709" font-size="10">数据1</text>
    <path d="M145 730 L330 732" stroke="#b54b45" stroke-width="1.5" stroke-dasharray="4 3"/><text x="215" y="725" fill="#b54b45" font-size="10">数据2丢失</text>
    <path d="M145 755 L715 767" stroke="#3f6f8a" stroke-width="1.5" marker-end="url(#tma)"/><text x="400" y="759" font-size="10">数据3（缓存，不交付）</text>
    <path d="M715 790 L145 805" stroke="#b54b45" stroke-width="1.5" marker-end="url(#tmr)"/><text x="400" y="795" fill="#b54b45" font-size="10">NAK2（立即要求重传）</text>
    <path d="M145 825 L715 840" stroke="#b54b45" stroke-width="1.5" marker-end="url(#tmr)"/><text x="400" y="830" fill="#b54b45" font-size="10">只重传数据2</text>
    <text x="800" y="690" font-size="11" fill="#52605a">接收窗口>1；乱序但正确的 3 先缓存，等 2 到达后一起交付。</text>
    <text x="800" y="715" font-size="11" fill="#52605a">每个未确认帧独立计时；缓冲区大小至少等于接收窗口。</text>
    <text x="800" y="740" font-size="11" fill="#52605a">收到错帧可立即回 NAK，让发送方重传，不必等超时。</text>
    <text x="800" y="765" font-size="11" fill="#52605a">约束：W_T+W_R≤2^n，W_R≤W_T，常各取 2^(n−1)。</text>
  </g>
</svg>
