<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="循环缓冲 in 和 out 指针">
  <defs>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b54b45"/></marker>
    <marker id="cb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3f6f8f"/></marker>
  </defs>
  <rect width="900" height="470" fill="#fffdf8"/>
  <text x="450" y="30" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="#24313a">循环缓冲：in 写、out 读</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <text x="230" y="60" text-anchor="middle" font-weight="700">空：in = out</text>
    <circle cx="230" cy="225" r="110" fill="none" stroke="#9aa6ad" stroke-width="2"/>
    <g>
      <circle cx="230" cy="115" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="230" y="120" text-anchor="middle">0</text>
      <circle cx="308" cy="147" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="308" y="152" text-anchor="middle">1</text>
      <circle cx="340" cy="225" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="340" y="230" text-anchor="middle">2</text>
      <circle cx="308" cy="303" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="308" y="308" text-anchor="middle">3</text>
      <circle cx="230" cy="335" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="230" y="340" text-anchor="middle">4</text>
      <circle cx="152" cy="303" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="152" y="308" text-anchor="middle">5</text>
      <circle cx="120" cy="225" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="120" y="230" text-anchor="middle">6</text>
      <circle cx="152" cy="147" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="152" y="152" text-anchor="middle">7</text>
    </g>
    <path d="M230 115 L230 92" stroke="#b54b45" stroke-width="3" marker-end="url(#ca)"/>
    <text x="250" y="90" fill="#b54b45">in = out（空）</text>
    <text x="230" y="390" text-anchor="middle" fill="#52605a">消费者读不到数据，等待生产者</text>

    <text x="670" y="60" text-anchor="middle" font-weight="700">满：in+1 == out</text>
    <circle cx="670" cy="225" r="110" fill="none" stroke="#9aa6ad" stroke-width="2"/>
    <g>
      <circle cx="670" cy="115" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="670" y="120" text-anchor="middle">0</text>
      <circle cx="748" cy="147" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="748" y="152" text-anchor="middle">1</text>
      <circle cx="780" cy="225" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="780" y="230" text-anchor="middle">2</text>
      <circle cx="748" cy="303" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="748" y="308" text-anchor="middle">3</text>
      <circle cx="670" cy="335" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="670" y="340" text-anchor="middle">4</text>
      <circle cx="592" cy="303" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="592" y="308" text-anchor="middle">5</text>
      <circle cx="560" cy="225" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="560" y="230" text-anchor="middle">6</text>
      <circle cx="592" cy="147" r="18" fill="#e9eef1" stroke="#9aa6ad"/><text x="592" y="152" text-anchor="middle">7</text>
    </g>
    <path d="M560 225 L560 250" stroke="#3f6f8f" stroke-width="3" marker-end="url(#cb)"/>
    <text x="500" y="280" fill="#3f6f8f">out</text>
    <path d="M592 303 L592 278" stroke="#b54b45" stroke-width="3" marker-end="url(#ca)"/>
    <text x="612" y="290" fill="#b54b45">in</text>
    <text x="670" y="390" text-anchor="middle" fill="#52605a">生产者写满，等待消费者取走</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#6b777f">
    <text x="450" y="425" text-anchor="middle">in 追上 out → 满；out 追上 in → 空；满/空同指针时需 count 或牺牲一个槽位</text>
  </g>
</svg>
