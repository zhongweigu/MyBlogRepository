<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-label="单缓冲与双缓冲甘特图">
  <rect width="940" height="560" fill="#fffdf8"/>
  <text x="470" y="30" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="#24313a">单缓冲 / 双缓冲的甘特图（示意）</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <text x="30" y="72" font-size="16" font-weight="700">单缓冲</text>
    <text x="30" y="116">设备输入 T</text>
    <text x="30" y="166">缓冲区搬运 M</text>
    <text x="30" y="216">CPU 处理 C</text>
    <text x="30" y="286" font-size="16" font-weight="700">双缓冲</text>
    <text x="30" y="330">设备输入 T</text>
    <text x="30" y="380">缓冲区搬运 M</text>
    <text x="30" y="430">CPU 处理 C</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#fff">
    <rect x="120" y="95" width="150" height="30" fill="#c47b3a"/><text x="195" y="115" text-anchor="middle">T1</text>
    <rect x="270" y="95" width="150" height="30" fill="#c47b3a"/><text x="345" y="115" text-anchor="middle">T2</text>
    <rect x="270" y="145" width="50" height="30" fill="#4d7f95"/><text x="295" y="165" text-anchor="middle">M1</text>
    <rect x="420" y="145" width="50" height="30" fill="#4d7f95"/><text x="445" y="165" text-anchor="middle">M2</text>
    <rect x="320" y="195" width="100" height="30" fill="#6f8f45"/><text x="370" y="215" text-anchor="middle">C1</text>
    <rect x="470" y="195" width="100" height="30" fill="#6f8f45"/><text x="520" y="215" text-anchor="middle">C2</text>

    <rect x="120" y="310" width="150" height="30" fill="#c47b3a"/><text x="195" y="330" text-anchor="middle">T1</text>
    <rect x="270" y="310" width="150" height="30" fill="#c47b3a"/><text x="345" y="330" text-anchor="middle">T2</text>
    <rect x="420" y="310" width="150" height="30" fill="#c47b3a"/><text x="495" y="330" text-anchor="middle">T3</text>
    <rect x="270" y="360" width="50" height="30" fill="#4d7f95"/><text x="295" y="380" text-anchor="middle">M1</text>
    <rect x="420" y="360" width="50" height="30" fill="#4d7f95"/><text x="445" y="380" text-anchor="middle">M2</text>
    <rect x="320" y="410" width="100" height="30" fill="#6f8f45"/><text x="370" y="430" text-anchor="middle">C1</text>
    <rect x="470" y="410" width="100" height="30" fill="#6f8f45"/><text x="520" y="430" text-anchor="middle">C2</text>
  </g>
  <g stroke="#4d5b66" stroke-width="1" opacity="0.5">
    <line x1="120" y1="250" x2="720" y2="250"/>
    <line x1="120" y1="465" x2="720" y2="465"/>
    <line x1="120" y1="90" x2="120" y2="230"/>
    <line x1="120" y1="305" x2="120" y2="445"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#6b777f">
    <text x="120" y="248">时间 →</text>
    <text x="120" y="463">时间 →</text>
    <text x="650" y="105">示意：块长不按统一刻度</text>
    <text x="650" y="125">M 必须在 T 结束后</text>
    <text x="650" y="145">C 可与下一块 T 重叠</text>
    <text x="650" y="345">双缓冲：设备填另一块，</text>
    <text x="650" y="365">CPU 同时处理已满块</text>
  </g>
  <g font-family="sans-serif" font-size="12">
    <rect x="650" y="400" width="22" height="14" fill="#c47b3a"/><text x="680" y="412" fill="#24313a">T 设备输入</text>
    <rect x="650" y="422" width="22" height="14" fill="#4d7f95"/><text x="680" y="434" fill="#24313a">M 缓冲→用户</text>
    <rect x="650" y="444" width="22" height="14" fill="#6f8f45"/><text x="680" y="456" fill="#24313a">C CPU 处理</text>
  </g>
</svg>
