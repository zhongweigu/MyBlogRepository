<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-label="FCFS、SJF 与时间片轮转的调度甘特图">
  <rect width="1100" height="640" fill="#fffdf8"/>
  <text x="550" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">CPU 调度甘特图（教学示例）</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="68" font-size="13">进程：P1、P2、P3 均在 0 时刻到达；服务时间分别为 3、2、1。</text>
    <text x="45" y="90" font-size="12" fill="#52605a">横轴为时间；同一行同一时刻只能有一个进程占用 CPU。</text>

    <text x="45" y="145" font-weight="700">FCFS</text>
    <text x="45" y="167" font-size="12">先到先服务</text>
    <text x="110" y="145" font-size="12">0</text><text x="210" y="145" font-size="12">1</text><text x="310" y="145" font-size="12">2</text><text x="410" y="145" font-size="12">3</text><text x="510" y="145" font-size="12">4</text><text x="610" y="145" font-size="12">5</text><text x="710" y="145" font-size="12">6</text>
    <line x1="110" y1="155" x2="710" y2="155" stroke="#4d5b66" stroke-width="1"/>
    <rect x="110" y="165" width="300" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="260" y="190" text-anchor="middle">P1</text>
    <rect x="410" y="165" width="200" height="38" fill="#f7ecd9" stroke="#a8782c"/><text x="510" y="190" text-anchor="middle">P2</text>
    <rect x="610" y="165" width="100" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="660" y="190" text-anchor="middle">P3</text>
    <text x="745" y="188" font-size="12">P1/P2/P3 等待：0/3/5；平均 2.67</text>

    <text x="45" y="270" font-weight="700">SJF</text>
    <text x="45" y="292" font-size="12">非抢占、短作业优先</text>
    <text x="110" y="270" font-size="12">0</text><text x="210" y="270" font-size="12">1</text><text x="310" y="270" font-size="12">2</text><text x="410" y="270" font-size="12">3</text><text x="510" y="270" font-size="12">4</text><text x="610" y="270" font-size="12">5</text><text x="710" y="270" font-size="12">6</text>
    <line x1="110" y1="280" x2="710" y2="280" stroke="#4d5b66" stroke-width="1"/>
    <rect x="110" y="290" width="300" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="260" y="315" text-anchor="middle">P1</text>
    <rect x="410" y="290" width="100" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="460" y="315" text-anchor="middle">P3</text>
    <rect x="510" y="290" width="200" height="38" fill="#f7ecd9" stroke="#a8782c"/><text x="610" y="315" text-anchor="middle">P2</text>
    <text x="745" y="313" font-size="12">P1/P2/P3 等待：0/4/3；平均 2.33</text>

    <text x="45" y="395" font-weight="700">RR（q=1）</text>
    <text x="45" y="417" font-size="12">时间片轮转</text>
    <text x="110" y="395" font-size="12">0</text><text x="210" y="395" font-size="12">1</text><text x="310" y="395" font-size="12">2</text><text x="410" y="395" font-size="12">3</text><text x="510" y="395" font-size="12">4</text><text x="610" y="395" font-size="12">5</text><text x="710" y="395" font-size="12">6</text>
    <line x1="110" y1="405" x2="710" y2="405" stroke="#4d5b66" stroke-width="1"/>
    <rect x="110" y="415" width="100" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="160" y="440" text-anchor="middle">P1</text>
    <rect x="210" y="415" width="100" height="38" fill="#f7ecd9" stroke="#a8782c"/><text x="260" y="440" text-anchor="middle">P2</text>
    <rect x="310" y="415" width="100" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="360" y="440" text-anchor="middle">P3</text>
    <rect x="410" y="415" width="100" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="460" y="440" text-anchor="middle">P1</text>
    <rect x="510" y="415" width="100" height="38" fill="#f7ecd9" stroke="#a8782c"/><text x="560" y="440" text-anchor="middle">P2</text>
    <rect x="610" y="415" width="100" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="660" y="440" text-anchor="middle">P1</text>
    <text x="745" y="438" font-size="12">P1/P2/P3 等待：3/3/2；平均 2.67</text>

    <g transform="translate(45,490)">
      <text font-weight="700" y="0">读图规则</text>
      <text y="26">等待时间 = 首次开始（或完成）− 到达 − 实际服务；甘特图只画“谁占 CPU”，不画 I/O 阻塞。</text>
      <text y="50">RR 在时间片用完处切回队尾；同样的到达/服务数据，轮转顺序与 FCFS/SJF 不同。</text>
      <text y="74">同一组进程，不同算法的平均等待时间不同；不要用一张图代替具体公式计算。</text>
    </g>
    <g transform="translate(805,545)">
      <rect width="18" height="12" fill="#e9f2f6" stroke="#4d7f95"/><text x="25" y="10">P1</text>
      <rect y="20" width="18" height="12" fill="#f7ecd9" stroke="#a8782c"/><text x="25" y="30">P2</text>
      <rect y="40" width="18" height="12" fill="#eef3e4" stroke="#6f8f45"/><text x="25" y="50">P3</text>
    </g>
  </g>
</svg>
