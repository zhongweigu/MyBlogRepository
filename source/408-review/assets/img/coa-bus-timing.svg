<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-label="总线定时：同步、异步、半同步、分离式">
  <rect width="1100" height="620" fill="#fffdf8"/>
  <g font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="36" fill="#b54634" font-size="12" font-weight="800" letter-spacing="2">BUS TIMING · 总线定时</text>
    <text x="40" y="66" fill="#1f2328" font-size="24" font-weight="700">同步、异步、半同步、分离式</text>

    <text x="40" y="105" fill="#14756f" font-size="13" font-weight="700">① 同步定时</text>
    <text x="40" y="128" fill="#667078" font-size="9.5">统一时钟；所有设备按同一节拍动作，慢设备插入等待周期。</text>
    <line x1="40" y1="145" x2="700" y2="145" stroke="#d9d2c4"/>
    <text x="40" y="170" fill="#1f2328" font-size="9">CLK</text>
    <path d="M80 180 L80 160 L120 160 L120 180 L160 180 L160 160 L200 160 L200 180 L240 180 L240 160 L280 160 L280 180 L320 180 L320 160 L360 160 L360 180 L400 180 L400 160 L440 160 L440 180 L480 180 L480 160 L520 160 L520 180 L560 180 L560 160 L600 160 L600 180" fill="none" stroke="#14756f" stroke-width="1.4"/>
    <text x="40" y="215" fill="#1f2328" font-size="9">DATA</text>
    <rect x="80" y="200" width="160" height="24" fill="#e8f2ef" stroke="#14756f"/>
    <text x="160" y="217" fill="#1f2328" font-size="9" text-anchor="middle">地址</text>
    <rect x="240" y="200" width="160" height="24" fill="#fffdf8" stroke="#14756f" stroke-dasharray="4 3"/>
    <text x="320" y="217" fill="#667078" font-size="8" text-anchor="middle">等待</text>
    <rect x="400" y="200" width="160" height="24" fill="#e8f2ef" stroke="#14756f"/>
    <text x="480" y="217" fill="#1f2328" font-size="9" text-anchor="middle">数据</text>
    <text x="720" y="170" fill="#667078" font-size="9">固定节拍</text>
    <text x="720" y="190" fill="#667078" font-size="9">控制简单</text>
    <text x="720" y="210" fill="#b54634" font-size="9">受最慢设备限制</text>

    <line x1="40" y1="245" x2="1060" y2="245" stroke="#d9d2c4"/>
    <text x="40" y="275" fill="#a9651f" font-size="13" font-weight="700">② 异步定时（请求—应答）</text>
    <text x="40" y="298" fill="#667078" font-size="9.5">不依赖统一时钟；用 REQ / ACK 握手，适应不同速度的设备。</text>
    <text x="40" y="330" fill="#1f2328" font-size="9">REQ</text>
    <path d="M80 345 L80 330 L200 330 L200 345 L360 345 L360 330 L420 330" fill="none" stroke="#a9651f" stroke-width="1.4"/>
    <text x="40" y="375" fill="#1f2328" font-size="9">ACK</text>
    <path d="M80 390 L160 390 L160 375 L280 375 L280 390 L420 390" fill="none" stroke="#355f91" stroke-width="1.4"/>
    <line x1="160" y1="330" x2="160" y2="375" stroke="#a9651f" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="280" y1="375" x2="280" y2="330" stroke="#355f91" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="150" y="315" fill="#a9651f" font-size="8">请求</text>
    <text x="270" y="408" fill="#355f91" font-size="8">应答</text>
    <text x="460" y="330" fill="#1f2328" font-size="9">数据传送</text>
    <text x="460" y="350" fill="#667078" font-size="8.5">全互锁：请求和应答都要等对方撤销</text>
    <text x="460" y="368" fill="#667078" font-size="8.5">半互锁：一方不等待撤销</text>
    <text x="460" y="386" fill="#667078" font-size="8.5">不互锁：发请求后不等应答</text>

    <line x1="40" y1="430" x2="1060" y2="430" stroke="#d9d2c4"/>
    <text x="40" y="460" fill="#355f91" font-size="13" font-weight="700">③ 半同步定时</text>
    <text x="40" y="483" fill="#667078" font-size="9.5">同步时钟 + WAIT/应答：慢设备插入等待，快设备按同步节拍跑。</text>
    <text x="40" y="513" fill="#1f2328" font-size="9">CLK</text>
    <path d="M80 525 L80 505 L120 505 L120 525 L160 525 L160 505 L200 505 L200 525 L240 525 L240 505 L280 505 L280 525 L320 525 L320 505 L360 505 L360 525 L400 525 L400 505 L440 505 L440 525 L480 525 L480 505 L520 505 L520 525" fill="none" stroke="#355f91" stroke-width="1.3"/>
    <text x="40" y="555" fill="#1f2328" font-size="9">WAIT</text>
    <path d="M80 565 L200 565 L200 550 L320 550 L320 565 L520 565" fill="none" stroke="#b54634" stroke-width="1.3"/>
    <text x="540" y="525" fill="#667078" font-size="9">折中方案</text>
    <text x="540" y="545" fill="#667078" font-size="9">比同步灵活</text>
    <text x="540" y="565" fill="#667078" font-size="9">比异步简单</text>

    <line x1="40" y1="585" x2="1060" y2="585" stroke="#d9d2c4"/>
    <text x="760" y="460" fill="#14756f" font-size="13" font-weight="700">④ 分离式事务</text>
    <text x="760" y="483" fill="#667078" font-size="9">请求/地址阶段释放总线，数据阶段再申请。</text>
    <rect x="760" y="500" width="100" height="28" fill="#e8f2ef" stroke="#14756f"/>
    <text x="810" y="519" fill="#1f2328" font-size="8" text-anchor="middle">请求+地址</text>
    <line x1="860" y1="514" x2="900" y2="514" stroke="#14756f" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="905" y="500" width="80" height="28" fill="#fffdf8" stroke="#d9d2c4"/>
    <text x="945" y="519" fill="#667078" font-size="8" text-anchor="middle">释放总线</text>
    <line x1="985" y1="514" x2="1015" y2="514" stroke="#14756f" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="1020" y="500" width="40" height="28" fill="#fbf4ea" stroke="#a9651f"/>
    <text x="1040" y="519" fill="#1f2328" font-size="7" text-anchor="middle">数据</text>
    <text x="760" y="548" fill="#667078" font-size="8.5">提高总线利用率；单次事务延迟变大。</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14756f"/></marker>
  </defs>
</svg>
