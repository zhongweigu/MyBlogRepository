<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-label="互斥锁与等待队列的时序">
  <defs>
    <marker id="sma" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="1060" height="560" fill="#fffdf8"/>
  <text x="530" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">互斥：同一时刻只有一个进程进入临界区</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="75" font-weight="700">时间线</text>
    <text x="80" y="105">P1</text>
    <text x="80" y="165">P2</text>
    <text x="80" y="225">mutex</text>

    <rect x="150" y="88" width="180" height="34" fill="#eef3e4" stroke="#6f8f45"/><text x="240" y="110" text-anchor="middle">申请锁，进入</text>
    <rect x="330" y="88" width="260" height="34" fill="#e9f2f6" stroke="#4d7f95"/><text x="460" y="110" text-anchor="middle">临界区：修改共享数据</text>
    <rect x="590" y="88" width="160" height="34" fill="#f7ecd9" stroke="#a8782c"/><text x="670" y="110" text-anchor="middle">V(mutex) 释放</text>

    <rect x="150" y="148" width="240" height="34" fill="#f3e6e6" stroke="#a85a5a"/><text x="270" y="170" text-anchor="middle">申请锁失败，进入等待队列</text>
    <rect x="390" y="148" width="200" height="34" fill="#f7f5ee" stroke="#c9c0ae"/><text x="490" y="170" text-anchor="middle">阻塞</text>
    <rect x="590" y="148" width="160" height="34" fill="#eef3e4" stroke="#6f8f45"/><text x="670" y="170" text-anchor="middle">被唤醒，获得锁</text>
    <rect x="750" y="148" width="230" height="34" fill="#e9f2f6" stroke="#4d7f95"/><text x="865" y="170" text-anchor="middle">进入临界区</text>

    <line x1="150" y1="225" x2="980" y2="225" stroke="#c9c0ae" stroke-width="1"/>
    <rect x="150" y="205" width="440" height="20" fill="#f7ecd9" stroke="#a8782c"/><text x="370" y="220" text-anchor="middle" font-size="12">mutex=0（被 P1 占用）</text>
    <rect x="590" y="205" width="160" height="20" fill="#eef3e4" stroke="#6f8f45"/><text x="670" y="220" text-anchor="middle" font-size="12">mutex=1</text>
    <rect x="750" y="205" width="230" height="20" fill="#f3e6e6" stroke="#a85a5a"/><text x="865" y="220" text-anchor="middle" font-size="12">mutex=0（P2）</text>

    <text x="45" y="280" font-weight="700">P/V 语义</text>
    <text x="45" y="306">P(mutex)：mutex−−；若 &lt;0，调用者阻塞，进入等待队列；mutex=1 → 0 时成功进入。</text>
    <text x="45" y="330">V(mutex)：mutex++；若 ≤0，从等待队列唤醒一个；被唤醒者不是立刻运行，而是变为就绪。</text>
    <text x="45" y="354">临界区里不能睡眠等待另一个互斥资源，否则可能死锁；临界区应尽量短。</text>

    <rect x="45" y="390" width="970" height="88" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="65" y="415" font-weight="700">互斥 vs 同步</text>
    <text x="65" y="439">互斥解决“不能同时进”：锁保护共享资源，初始 mutex=1。</text>
    <text x="65" y="463">同步解决“先后顺序”：条件信号量初始 0，等待方 P，完成方 V；不要用同一把锁兼做先后条件。</text>

    <text x="45" y="520" font-size="12" fill="#6b777f">本图是进程调度无关的逻辑时序；P1/P2 实际谁先运行由调度器决定，互斥只保证不重叠进入。</text>
  </g>
</svg>
