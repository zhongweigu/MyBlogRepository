<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" role="img" aria-label="电路交换、报文交换和分组交换的时延图">
  <defs>
    <marker id="swa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="1100" height="920" fill="#fffdf8"/>
  <text x="550" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">三种交换的时延图：竖线是结点，向下是时间</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <g>
      <text x="45" y="75" font-weight="700">A. 电路交换：先建立连接，再连续传</text>
      <line x1="150" y1="95" x2="150" y2="280" stroke="#4d5b66" stroke-width="2"/>
      <line x1="450" y1="95" x2="450" y2="280" stroke="#4d5b66" stroke-width="2"/>
      <line x1="750" y1="95" x2="750" y2="280" stroke="#4d5b66" stroke-width="2"/>
      <text x="150" y="300" text-anchor="middle">H1</text><text x="450" y="300" text-anchor="middle">路由器</text><text x="750" y="300" text-anchor="middle">H2</text>
      <path d="M150 115 L450 135 L750 155" stroke="#3f6f8a" stroke-width="2" fill="none" marker-end="url(#swa)"/>
      <text x="500" y="125" fill="#3f6f8a">建立连接</text>
      <rect x="150" y="165" width="600" height="45" fill="#e9f2f6" stroke="#4d7f95" opacity="0.7"/>
      <text x="450" y="192" text-anchor="middle">数据连续传输（独占通路）</text>
      <path d="M150 235 L450 250 L750 265" stroke="#b54b45" stroke-width="2" fill="none" marker-end="url(#swa)"/>
      <text x="500" y="245" fill="#b54b45">释放连接</text>
      <text x="45" y="330" font-size="12">时延 ≈ 建立 + 传输 + 传播；建立后无逐结点存储转发，但空闲也占资源。</text>
    </g>

    <g>
      <text x="45" y="370" font-weight="700">B. 报文交换：整个报文逐站存储转发</text>
      <line x1="150" y1="390" x2="150" y2="585" stroke="#4d5b66" stroke-width="2"/>
      <line x1="450" y1="390" x2="450" y2="585" stroke="#4d5b66" stroke-width="2"/>
      <line x1="750" y1="390" x2="750" y2="585" stroke="#4d5b66" stroke-width="2"/>
      <text x="150" y="605" text-anchor="middle">H1</text><text x="450" y="605" text-anchor="middle">路由器</text>
      <polygon points="150,420 450,470 450,530 150,480" fill="#f7ecd9" stroke="#a8782c"/>
      <text x="300" y="485" text-anchor="middle">整个报文</text>
      <polygon points="450,500 750,550 750,610 450,560" fill="#f7ecd9" stroke="#a8782c"/>
      <text x="600" y="565" text-anchor="middle">存储后再转发</text>
      <text x="750" y="640" text-anchor="middle">H2</text>
      <text x="45" y="635" font-size="12">每站必须收完整个报文才能转发；报文越长，存储转发时延越大，对缓存要求越高。</text>
    </g>

    <g>
      <text x="45" y="675" font-weight="700">C. 分组交换：切成小包，流水线转发</text>
      <line x1="150" y1="695" x2="150" y2="825" stroke="#4d5b66" stroke-width="2"/>
      <line x1="450" y1="695" x2="450" y2="825" stroke="#4d5b66" stroke-width="2"/>
      <line x1="750" y1="695" x2="750" y2="825" stroke="#4d5b66" stroke-width="2"/>
      <text x="150" y="845" text-anchor="middle">H1</text><text x="450" y="845" text-anchor="middle">路由器</text><text x="750" y="845" text-anchor="middle">H2</text>
      <g fill="#eef3e4" stroke="#6f8f45">
        <polygon points="150,710 450,730 450,755 150,735"/>
        <polygon points="150,740 450,760 450,785 150,765"/>
        <polygon points="150,770 450,790 450,815 150,795"/>
        <polygon points="450,730 750,750 750,775 450,755"/>
        <polygon points="450,760 750,780 750,805 450,785"/>
        <polygon points="450,790 750,810 750,835 450,815"/>
      </g>
      <text x="900" y="735" font-size="12">包 1/2/3 可以在路由器</text>
      <text x="900" y="755" font-size="12">前后交叠转发</text>
      <text x="45" y="875" font-size="12">每包仍要存储转发，但小包可以流水线；代价是首部开销、乱序和重组。</text>
    </g>
  </g>
</svg>
