<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="一棵红黑树的性质示意">
  <rect width="1000" height="420" fill="#fffdf8"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="55" y="42" fill="#1b2425" font-size="20" font-weight="700">红黑树：用颜色换平衡</text>
    <text x="55" y="68" fill="#68736f" font-size="12">黑高 BH 相同；最长路径不超过最短路径的两倍。</text>

    <!-- edges -->
    <g stroke="#68736f" stroke-width="1.4">
      <line x1="500" y1="125" x2="390" y2="215"/><line x1="500" y1="125" x2="610" y2="215"/>
      <line x1="390" y1="215" x2="320" y2="315"/><line x1="390" y1="215" x2="460" y2="315"/>
      <line x1="610" y1="215" x2="540" y2="315"/><line x1="610" y1="215" x2="680" y2="315"/>
    </g>
    <!-- nodes -->
    <g>
      <circle cx="500" cy="105" r="30" fill="#1b2425" stroke="#111" stroke-width="1.5"/>
      <text x="500" y="112" fill="#fff" font-size="16" text-anchor="middle" font-weight="700">30</text>
      <circle cx="390" cy="235" r="28" fill="#af3a2c" stroke="#7c1f16" stroke-width="1.5"/>
      <text x="390" y="242" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">15</text>
      <circle cx="610" cy="235" r="28" fill="#af3a2c" stroke="#7c1f16" stroke-width="1.5"/>
      <text x="610" y="242" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">50</text>
      <circle cx="320" cy="335" r="27" fill="#1b2425" stroke="#111" stroke-width="1.5"/>
      <text x="320" y="342" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">10</text>
      <circle cx="460" cy="335" r="27" fill="#1b2425" stroke="#111" stroke-width="1.5"/>
      <text x="460" y="342" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">20</text>
      <circle cx="540" cy="335" r="27" fill="#1b2425" stroke="#111" stroke-width="1.5"/>
      <text x="540" y="342" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">40</text>
      <circle cx="680" cy="335" r="27" fill="#1b2425" stroke="#111" stroke-width="1.5"/>
      <text x="680" y="342" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">60</text>
    </g>

    <!-- annotations -->
    <g font-size="12.5" fill="#4d5a59">
      <text x="70" y="120">根是黑</text>
      <text x="70" y="146">红结点的孩子是黑</text>
      <text x="70" y="172">每个结点到 NIL 的黑结点数相同</text>
      <text x="70" y="198">最长路径 ≤ 2 × 最短路径</text>
      <text x="70" y="224">树高 O(log n)，插入最多 2 次旋转</text>
    </g>

    <g font-size="12" fill="#68736f">
      <text x="810" y="130">黑结点</text>
      <circle cx="880" cy="124" r="9" fill="#1b2425"/>
      <text x="810" y="172">红结点</text>
      <circle cx="880" cy="166" r="9" fill="#af3a2c"/>
    </g>
    <text x="320" y="396" fill="#68736f" font-size="11">例：黑高为 2；红色结点只出现在黑结点之间，不连续红。</text>
  </g>
</svg>
