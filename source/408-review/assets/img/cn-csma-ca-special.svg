<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-label="CSMA/CA 特殊情况的退避冻结与 CTS/ACK 超时处理">
  <defs>
    <marker id="csa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4d5b66"/></marker>
    <marker id="csr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#fffdf8"/>
  <text x="560" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">CSMA/CA 特殊情况：DIFS 被打断、退避冻结、CTS/ACK 超时</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <text x="40" y="75" font-weight="700">A. DIFS 或退避过程中信道变忙</text>
    <line x1="40" y1="120" x2="1080" y2="120" stroke="#4d5b66"/>

    <rect x="70" y="95" width="100" height="25" fill="#f7f5ee" stroke="#c9c0ae"/><text x="120" y="112" text-anchor="middle" font-size="11">DIFS</text>
    <rect x="170" y="95" width="70" height="25" fill="#f3e6e6" stroke="#a85a5a"/><text x="205" y="112" text-anchor="middle" font-size="10">变忙</text>
    <rect x="240" y="95" width="100" height="25" fill="#f7f5ee" stroke="#c9c0ae"/><text x="290" y="112" text-anchor="middle" font-size="11">重新 DIFS</text>

    <text x="380" y="88" font-size="12">退避 5 个时隙：</text>
    <rect x="380" y="95" width="40" height="25" fill="#e9f2f6" stroke="#4d7f95"/><text x="400" y="112" text-anchor="middle" font-size="10">1</text>
    <rect x="420" y="95" width="40" height="25" fill="#e9f2f6" stroke="#4d7f95"/><text x="440" y="112" text-anchor="middle" font-size="10">2</text>
    <rect x="460" y="95" width="90" height="25" fill="#f3e6e6" stroke="#a85a5a"/><text x="505" y="112" text-anchor="middle" font-size="10">冻结（剩3）</text>
    <rect x="550" y="95" width="100" height="25" fill="#f7f5ee" stroke="#c9c0ae"/><text x="600" y="112" text-anchor="middle" font-size="11">重新 DIFS</text>
    <rect x="650" y="95" width="120" height="25" fill="#e9f2f6" stroke="#4d7f95"/><text x="710" y="112" text-anchor="middle" font-size="10">继续 3 个时隙</text>
    <rect x="770" y="95" width="60" height="25" fill="#eef3e4" stroke="#6f8f45"/><text x="800" y="112" text-anchor="middle" font-size="10">发送</text>

    <text x="70" y="155" font-size="12" fill="#b54b45">关键：DIFS 被打断要重新等完整 DIFS；退避计时器只冻结，不重新随机。</text>
    <text x="70" y="178" font-size="12">例：选 5、已减 2、信道忙 → 冻结，剩 3；再空闲后先等 DIFS，再继续 3 个时隙。</text>

    <text x="40" y="225" font-weight="700">B. 什么时候可以不退避</text>
    <text x="40" y="250" font-size="12">只有“<tspan font-weight="700" fill="#b54b45">第一次发送 + 检测到信道空闲 + DIFS 持续空闲</tspan>”才可以直接发。</text>
    <text x="40" y="274" font-size="12">第一次发送但信道忙、重传、RTS 失败后重新竞争：都要退避。</text>
    <text x="40" y="298" font-size="12">已经进入 RTS/CTS/DATA/ACK 的连续交换：帧间只等 SIFS，不需要重新退避。</text>

    <text x="40" y="350" font-weight="700">C. CTS 超时与 ACK 超时</text>
    <rect x="40" y="370" width="500" height="150" rx="4" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="60" y="395" font-weight="700">RTS 后没有 CTS</text>
    <text x="60" y="420" font-size="12">RTS 丢失/冲突、AP 没收到、CTS 丢失</text>
    <text x="60" y="445" font-size="12">→ CTS 超时 → 判定失败 → 增大 CW</text>
    <text x="60" y="470" font-size="12">→ 重新退避 → <tspan font-weight="700">重传 RTS</tspan>（不是直接发 DATA）</text>
    <text x="60" y="500" font-size="11" fill="#52605a">如果原本用 RTS/CTS，重传通常重新握手。</text>

    <rect x="570" y="370" width="510" height="150" rx="4" fill="#f7ecd9" stroke="#a8782c"/>
    <text x="590" y="395" font-weight="700">DATA 后没有 ACK</text>
    <text x="590" y="420" font-size="12">DATA 丢失/冲突、ACK 丢失、ACK 受干扰</text>
    <text x="590" y="445" font-size="12">→ ACK 超时 → 判定失败 → 增大 CW</text>
    <text x="590" y="470" font-size="12">→ 重新退避 → <tspan font-weight="700">重传 DATA</tspan></text>
    <text x="590" y="500" font-size="11" fill="#52605a">若原来用 RTS/CTS，通常重新 RTS/CTS 再发 DATA。</text>

    <text x="40" y="565" font-weight="700">D. ACK 丢失不等于 DATA 没到</text>
    <text x="40" y="590" font-size="12">B 正确收到 DATA、回了 ACK，但 ACK 在途中丢失；A 超时重传 DATA。B 可能收到重复 DATA。</text>
    <text x="40" y="614" font-size="12">B 用 <tspan font-weight="700">序列号 + Retry 标志</tspan> 识别重复帧：不重复向上层交付，但可以再回一个 ACK。</text>

    <text x="40" y="660" font-weight="700">E. 超过最大重试次数</text>
    <text x="40" y="684" font-size="12">连续失败超过上限：放弃本次发送，向上层报告失败；不是无限重试。</text>
  </g>
</svg>
