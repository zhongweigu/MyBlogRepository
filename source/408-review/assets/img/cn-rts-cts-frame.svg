<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="RTS和CTS帧格式">
  <rect width="900" height="360" fill="#fffdf8"/>
  <text x="450" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">RTS / CTS 帧格式：短控制帧，只负责预约信道</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="85" font-weight="700">RTS（20B）</text>
    <g font-size="13">
      <rect x="55" y="105" width="110" height="48" fill="#e9f2f6" stroke="#4d7f95"/><text x="110" y="135" text-anchor="middle">帧控制 2B</text>
      <rect x="165" y="105" width="100" height="48" fill="#f7ecd9" stroke="#a8782c"/><text x="215" y="135" text-anchor="middle">持续期 2B</text>
      <rect x="265" y="105" width="150" height="48" fill="#eef3e4" stroke="#6f8f45"/><text x="340" y="135" text-anchor="middle">接收地址 RA 6B</text>
      <rect x="415" y="105" width="150" height="48" fill="#eef3e4" stroke="#6f8f45"/><text x="490" y="135" text-anchor="middle">发送地址 TA 6B</text>
      <rect x="565" y="105" width="120" height="48" fill="#f3e6e6" stroke="#a85a5a"/><text x="625" y="135" text-anchor="middle">FCS 4B</text>
    </g>

    <text x="45" y="215" font-weight="700">CTS（14B）</text>
    <g font-size="13">
      <rect x="55" y="235" width="110" height="48" fill="#e9f2f6" stroke="#4d7f95"/><text x="110" y="265" text-anchor="middle">帧控制 2B</text>
      <rect x="165" y="235" width="100" height="48" fill="#f7ecd9" stroke="#a8782c"/><text x="215" y="265" text-anchor="middle">持续期 2B</text>
      <rect x="265" y="235" width="150" height="48" fill="#eef3e4" stroke="#6f8f45"/><text x="340" y="265" text-anchor="middle">接收地址 RA 6B</text>
      <rect x="415" y="235" width="120" height="48" fill="#f3e6e6" stroke="#a85a5a"/><text x="475" y="265" text-anchor="middle">FCS 4B</text>
    </g>

    <text x="45" y="320" font-size="12" fill="#52605a">RTS 多一个“发送地址 TA”；CTS 只回给 RTS 的发送方，所以只需要 RA。</text>
    <text x="45" y="342" font-size="12" fill="#b54b45">Duration 字段填入“从本帧结束到 ACK 结束”的剩余时间；RTS 的 Duration 覆盖 CTS+DATA+ACK，CTS 覆盖 DATA+ACK。</text>
  </g>
</svg>
