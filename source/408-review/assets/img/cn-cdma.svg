<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-label="CDMA 码片分配、叠加与解码">
  <rect width="1120" height="700" fill="#fffdf8"/>
  <text x="560" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">CDMA：每个站一套正交码片，所有站同时同频发送</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="75" font-weight="700">① 先给每个站分配一张“码片表”</text>
    <text x="45" y="98" font-size="12">4 个站用 4 位码片；任意两站码片的内积为 0（正交）。</text>

    <g font-size="13" font-family="monospace">
      <text x="55" y="135">A</text><rect x="85" y="115" width="50" height="28" fill="#e9f2f6" stroke="#4d7f95"/><text x="110" y="134" text-anchor="middle">+1</text><rect x="135" y="115" width="50" height="28" fill="#e9f2f6" stroke="#4d7f95"/><text x="160" y="134" text-anchor="middle">+1</text><rect x="185" y="115" width="50" height="28" fill="#e9f2f6" stroke="#4d7f95"/><text x="210" y="134" text-anchor="middle">+1</text><rect x="235" y="115" width="50" height="28" fill="#e9f2f6" stroke="#4d7f95"/><text x="260" y="134" text-anchor="middle">+1</text>
      <text x="320" y="134">← 码片 A</text>
      <text x="55" y="180">B</text><rect x="85" y="160" width="50" height="28" fill="#f7ecd9" stroke="#a8782c"/><text x="110" y="179" text-anchor="middle">+1</text><rect x="135" y="160" width="50" height="28" fill="#f7ecd9" stroke="#a8782c"/><text x="160" y="179" text-anchor="middle">−1</text><rect x="185" y="160" width="50" height="28" fill="#f7ecd9" stroke="#a8782c"/><text x="210" y="179" text-anchor="middle">+1</text><rect x="235" y="160" width="50" height="28" fill="#f7ecd9" stroke="#a8782c"/><text x="260" y="179" text-anchor="middle">−1</text>
      <text x="320" y="179">← 码片 B</text>
      <text x="55" y="225">C</text><rect x="85" y="205" width="50" height="28" fill="#eef3e4" stroke="#6f8f45"/><text x="110" y="224" text-anchor="middle">+1</text><rect x="135" y="205" width="50" height="28" fill="#eef3e4" stroke="#6f8f45"/><text x="160" y="224" text-anchor="middle">+1</text><rect x="185" y="205" width="50" height="28" fill="#eef3e4" stroke="#6f8f45"/><text x="210" y="224" text-anchor="middle">−1</text><rect x="235" y="205" width="50" height="28" fill="#eef3e4" stroke="#6f8f45"/><text x="260" y="224" text-anchor="middle">−1</text>
      <text x="320" y="224">← 码片 C</text>
      <text x="55" y="270">D</text><rect x="85" y="250" width="50" height="28" fill="#f3e6e6" stroke="#a85a5a"/><text x="110" y="269" text-anchor="middle">+1</text><rect x="135" y="250" width="50" height="28" fill="#f3e6e6" stroke="#a85a5a"/><text x="160" y="269" text-anchor="middle">−1</text><rect x="185" y="250" width="50" height="28" fill="#f3e6e6" stroke="#a85a5a"/><text x="210" y="269" text-anchor="middle">−1</text><rect x="235" y="250" width="50" height="28" fill="#f3e6e6" stroke="#a85a5a"/><text x="260" y="269" text-anchor="middle">+1</text>
      <text x="320" y="269">← 码片 D</text>
    </g>

    <text x="45" y="325" font-weight="700">② 这一拍各站发什么</text>
    <text x="45" y="350">A 发 1：发码片 A；B 发 0：发 B 的反码；</text>
    <text x="45" y="370">C 不发：全 0；D 发 1：发 D 的码片。</text>
    <g font-size="13" font-family="monospace">
      <text x="55" y="390">A(1)</text><text x="120" y="390">+1 +1 +1 +1</text>
      <text x="55" y="418">B(0)</text><text x="120" y="418">−1 +1 −1 +1</text>
      <text x="55" y="446">C(—)</text><text x="120" y="446"> 0  0  0  0</text>
      <text x="55" y="474">D(1)</text><text x="120" y="474">+1 −1 −1 +1</text>
      <line x1="45" y1="492" x2="420" y2="492" stroke="#c9c0ae"/>
      <text x="55" y="520">叠加和</text><text x="120" y="520" font-weight="700">+1 +1 −1 +3</text>
    </g>

    <text x="560" y="325" font-weight="700">③ 接收端用“内积”解码</text>
    <text x="560" y="350" font-size="12">把叠加和分别与各站码片做内积，再除以码片长度 4：</text>
    <g font-size="13" font-family="monospace">
      <text x="560" y="390">A: (1+1−1+3)/4 = +1 → 1</text>
      <text x="560" y="418">B: (1−1−1−3)/4 = −1 → 0</text>
      <text x="560" y="446">C: (1+1+1−3)/4 = 0 → 未发送</text>
      <text x="560" y="474">D: (1−1+1+3)/4 = +1 → 1</text>
    </g>
    <text x="560" y="515" font-size="12" fill="#52605a">+1 表示发 1，−1 表示发 0，0 表示该站这一拍没有数据。</text>

    <rect x="45" y="550" width="1030" height="115" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="65" y="575" font-weight="700">码片怎么确定</text>
    <text x="65" y="600" font-size="13">选 m 个两两正交的 ±1 序列（m 通常取 2 的幂，如 Walsh/Hadamard 码），每个站分一条；码片长度 m 决定一个比特扩成 m 个码片。</text>
    <text x="65" y="624" font-size="13">正交：同码内积 = m，不同码内积 = 0；所以接收端用自己的码片一“点”，其他站的贡献为 0，只剩自己的信号。</text>
    <text x="65" y="648" font-size="12" fill="#b54b45">码片速率 = m × 比特率；实际 CDMA 还要功率控制/同步，这里用 4 位码片是为了看清计算。</text>
  </g>
</svg>
