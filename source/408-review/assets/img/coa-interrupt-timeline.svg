<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="中断从请求到返回的完整时间线">
  <rect width="1100" height="700" fill="#fffdf8"/>
  <g font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="36" fill="#b54634" font-size="12" font-weight="800" letter-spacing="2">INTERRUPT · 从请求到返回</text>
    <text x="40" y="66" fill="#1f2328" font-size="24" font-weight="700">一条指令结束后的完整路径</text>

    <line x1="70" y1="120" x2="1040" y2="120" stroke="#d9d2c4" stroke-width="2"/>
    <g font-size="10" fill="#667078">
      <text x="85" y="105">设备侧</text>
      <text x="330" y="105">CPU 指令边界</text>
      <text x="570" y="105">硬件隐指令</text>
      <text x="815" y="105">软件服务程序</text>
      <text x="985" y="105">返回</text>
    </g>

    <rect x="55" y="155" width="170" height="78" fill="#fbf4ea" stroke="#a9651f"/>
    <text x="140" y="181" fill="#1f2328" font-size="13" text-anchor="middle">① 中断请求</text>
    <text x="140" y="201" fill="#667078" font-size="9" text-anchor="middle">设备完成 / 需要服务</text>
    <text x="140" y="219" fill="#667078" font-size="9" text-anchor="middle">置请求，保持到响应</text>

    <line x1="225" y1="194" x2="275" y2="194" stroke="#a9651f" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="280" y="155" width="190" height="78" fill="#fbf4ea" stroke="#a9651f"/>
    <text x="375" y="181" fill="#1f2328" font-size="13" text-anchor="middle">② 中断控制器</text>
    <text x="375" y="201" fill="#667078" font-size="9" text-anchor="middle">排队判优 / 检查屏蔽</text>
    <text x="375" y="219" fill="#667078" font-size="9" text-anchor="middle">向 CPU 发 INTR</text>

    <line x1="470" y1="194" x2="520" y2="194" stroke="#a9651f" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="525" y="155" width="210" height="78" fill="#e8f2ef" stroke="#14756f"/>
    <text x="630" y="181" fill="#1f2328" font-size="13" text-anchor="middle">③ 指令结束时检查</text>
    <text x="630" y="201" fill="#667078" font-size="9" text-anchor="middle">IF=1？指令结束？未屏蔽？</text>
    <text x="630" y="219" fill="#667078" font-size="9" text-anchor="middle">满足才响应，否则继续执行</text>

    <line x1="735" y1="194" x2="785" y2="194" stroke="#14756f" stroke-width="1.4" marker-end="url(#b)"/>
    <rect x="790" y="155" width="250" height="78" fill="#e8f2ef" stroke="#14756f"/>
    <text x="915" y="181" fill="#1f2328" font-size="13" text-anchor="middle">④ 中断应答 / 取类型号</text>
    <text x="915" y="201" fill="#667078" font-size="9" text-anchor="middle">CPU 发 INTA，控制器送类型号</text>
    <text x="915" y="219" fill="#667078" font-size="9" text-anchor="middle">类型号用来查向量表</text>

    <path d="M790 194 L760 194 L760 260 L140 260 L140 240" fill="none" stroke="#a9651f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="450" y="280" fill="#a9651f" font-size="9">设备→控制器→CPU 的请求/应答路径</text>

    <rect x="55" y="310" width="300" height="135" fill="#eef2f8" stroke="#355f91"/>
    <text x="75" y="338" fill="#355f91" font-size="13" font-weight="700">⑤ 中断隐指令：保存断点</text>
    <text x="75" y="362" fill="#1f2328" font-size="10">硬件自动完成，不是机器指令：</text>
    <text x="75" y="384" fill="#1f2328" font-size="10">关中断；旧 PSW、PC 入栈（或指定单元）；</text>
    <text x="75" y="405" fill="#1f2328" font-size="10">取类型号 → 查向量表 → 入口送 PC；</text>
    <text x="75" y="426" fill="#1f2328" font-size="10">切换到内核态/内核栈。</text>

    <line x1="355" y1="378" x2="405" y2="378" stroke="#355f91" stroke-width="1.4" marker-end="url(#c)"/>
    <rect x="410" y="310" width="300" height="135" fill="#eef2f8" stroke="#355f91"/>
    <text x="430" y="338" fill="#355f91" font-size="13" font-weight="700">⑥ 数据怎么流</text>
    <text x="430" y="362" fill="#1f2328" font-size="10">PC/PSW → 内存栈（写）；</text>
    <text x="430" y="384" fill="#1f2328" font-size="10">中断向量表[类型号] → PC（读）；</text>
    <text x="430" y="405" fill="#1f2328" font-size="10">栈指针 SP 随压栈变化；</text>
    <text x="430" y="426" fill="#1f2328" font-size="10">入口地址不是类型号本身。</text>

    <line x1="710" y1="378" x2="760" y2="378" stroke="#355f91" stroke-width="1.4" marker-end="url(#c)"/>
    <rect x="765" y="310" width="275" height="135" fill="#f8f2e7" stroke="#a9651f"/>
    <text x="785" y="338" fill="#a9651f" font-size="13" font-weight="700">⑦ 服务程序：保护现场</text>
    <text x="785" y="362" fill="#1f2328" font-size="10">通用寄存器压栈（软件指令）；</text>
    <text x="785" y="384" fill="#1f2328" font-size="10">可嵌套时保护现场后开中断；</text>
    <text x="785" y="405" fill="#1f2328" font-size="10">读状态、读写数据端口、清请求；</text>
    <text x="785" y="426" fill="#1f2328" font-size="10">恢复现场，准备 IRET。</text>

    <path d="M900 445 L900 495 L140 495 L140 445" fill="none" stroke="#b54634" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#d)"/>
    <text x="470" y="515" fill="#b54634" font-size="10" text-anchor="middle">⑧ IRET：从栈中弹出 PSW/PC，返回断点</text>

    <rect x="55" y="550" width="300" height="100" fill="#fff8f4" stroke="#b54634"/>
    <text x="75" y="576" fill="#b54634" font-size="12" font-weight="700">返回哪里？</text>
    <text x="75" y="598" fill="#1f2328" font-size="10">外中断：被中断指令的下一条指令。</text>
    <text x="75" y="619" fill="#1f2328" font-size="10">故障 fault：重新执行当前指令。</text>
    <text x="75" y="640" fill="#1f2328" font-size="10">陷阱 trap：下一条；终止 abort：不返回。</text>

    <rect x="375" y="550" width="665" height="100" fill="#f8f2e7" stroke="#d9d2c4"/>
    <text x="395" y="576" fill="#b54634" font-size="12" font-weight="700">易错点</text>
    <text x="395" y="598" fill="#1f2328" font-size="10">中断通常在指令边界响应，不是任意时钟；隐指令保存 PC/PSW，通用寄存器由服务程序保存。</text>
    <text x="395" y="619" fill="#1f2328" font-size="10">中断向量 = 服务程序入口地址；类型号只是查表索引。中断请求要保持到被响应或清除。</text>
    <text x="395" y="640" fill="#1f2328" font-size="10">多重中断的响应顺序看硬件排队，能否嵌套看当前屏蔽字。</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a9651f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14756f"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#355f91"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b54634"/></marker>
  </defs>
</svg>
