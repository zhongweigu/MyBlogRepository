<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" role="img" aria-label="栈的后进先出与双端队列的端口限制">
  <defs>
    <marker id="sqa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="1040" height="590" fill="#fffdf8"/>
  <text x="520" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">栈是“一端进出”，双端队列是“端口受限制的队列”</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="76" font-weight="700">A. 栈：只在栈顶 push / pop，后进先出</text>
    <rect x="70" y="100" width="120" height="44" fill="#eef3e4" stroke="#6f8f45"/><text x="130" y="127" text-anchor="middle">底</text>
    <rect x="70" y="144" width="120" height="44" fill="#eef3e4" stroke="#6f8f45"/><text x="130" y="171" text-anchor="middle">1</text>
    <rect x="70" y="188" width="120" height="44" fill="#eef3e4" stroke="#6f8f45"/><text x="130" y="215" text-anchor="middle">2</text>
    <rect x="70" y="232" width="120" height="44" fill="#f7ecd9" stroke="#a8782c"/><text x="130" y="259" text-anchor="middle">3 ← top</text>
    <path d="M220 254 L195 254" stroke="#4d5b66" stroke-width="2" marker-end="url(#sqa)"/>
    <text x="230" y="248">pop 先取 3</text>
    <path d="M130 320 L130 280" stroke="#4d5b66" stroke-width="2" marker-end="url(#sqa)"/>
    <text x="145" y="312">push 也只在顶部</text>
    <text x="280" y="127">入栈 1、2、3</text>
    <text x="280" y="151">出栈顺序 3、2、1</text>
    <text x="280" y="175" font-size="12" fill="#52605a">栈底不能直接弹出；只有栈顶可见。</text>

    <text x="45" y="365" font-weight="700">B. 双端队列：入队/出队端口组合</text>
    <g>
      <rect x="60" y="390" width="250" height="115" rx="4" fill="#e9f2f6" stroke="#4d7f95"/>
      <text x="185" y="414" text-anchor="middle" font-weight="700">① 两端入、一端出</text>
      <text x="185" y="438" text-anchor="middle" font-size="12">输出受限</text>
      <text x="185" y="460" text-anchor="middle" font-size="12">入：左端/右端</text>
      <text x="185" y="480" text-anchor="middle" font-size="12">出：只允许一端</text>
    </g>
    <g>
      <rect x="395" y="390" width="250" height="115" rx="4" fill="#f7ecd9" stroke="#a8782c"/>
      <text x="520" y="414" text-anchor="middle" font-weight="700">② 一端入、两端出</text>
      <text x="520" y="438" text-anchor="middle" font-size="12">输入受限</text>
      <text x="520" y="460" text-anchor="middle" font-size="12">入：只允许一端</text>
      <text x="520" y="480" text-anchor="middle" font-size="12">出：左端/右端</text>
    </g>
    <g>
      <rect x="730" y="390" width="250" height="115" rx="4" fill="#eef3e4" stroke="#6f8f45"/>
      <text x="855" y="414" text-anchor="middle" font-weight="700">③ 两端入、两端出</text>
      <text x="855" y="438" text-anchor="middle" font-size="12">双端队列（无限制）</text>
      <text x="855" y="460" text-anchor="middle" font-size="12">入：左/右</text>
      <text x="855" y="480" text-anchor="middle" font-size="12">出：左/右</text>
    </g>

    <text x="45" y="545" font-size="12" fill="#6b777f">判定出队序列时，先看“哪一端能进、哪一端能出”，再按题目规定的入队/出队时机模拟；不要套普通队列的 FIFO。</text>
  </g>
</svg>
