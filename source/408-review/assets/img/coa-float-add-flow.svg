<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-label="浮点数加减运算流程">
  <defs>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
    <marker id="fb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1040" height="620" fill="#fffdf8"/>
  <text x="520" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">浮点数加减：对阶 → 尾数运算 → 规格化 → 舍入</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <rect x="60" y="85" width="170" height="64" rx="5" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="145" y="108" text-anchor="middle" font-weight="700">取两个浮点数</text>
    <text x="145" y="128" text-anchor="middle" font-size="12">判零/无穷/NaN</text>

    <rect x="290" y="85" width="170" height="64" rx="5" fill="#e9f2f6" stroke="#4d7f95"/>
    <text x="375" y="108" text-anchor="middle" font-weight="700">① 对阶</text>
    <text x="375" y="128" text-anchor="middle" font-size="12">小阶向大阶看齐</text>
    <text x="375" y="143" text-anchor="middle" font-size="11">尾数右移 ΔE 位</text>

    <rect x="520" y="85" width="170" height="64" rx="5" fill="#f7ecd9" stroke="#a8782c"/>
    <text x="605" y="108" text-anchor="middle" font-weight="700">② 尾数加减</text>
    <text x="605" y="128" text-anchor="middle" font-size="12">同阶后做定点运算</text>
    <text x="605" y="143" text-anchor="middle" font-size="11">保留 G/R/S</text>

    <rect x="750" y="85" width="170" height="64" rx="5" fill="#f3e6e6" stroke="#a85a5a"/>
    <text x="835" y="108" text-anchor="middle" font-weight="700">③ 规格化</text>
    <text x="835" y="128" text-anchor="middle" font-size="12">左规或右规</text>
    <text x="835" y="143" text-anchor="middle" font-size="11">同步调整阶码</text>

    <rect x="750" y="300" width="170" height="64" rx="5" fill="#eadff2" stroke="#7f5b9a"/>
    <text x="835" y="323" text-anchor="middle" font-weight="700">④ 舍入</text>
    <text x="835" y="343" text-anchor="middle" font-size="12">就近、偶数优先</text>
    <text x="835" y="358" text-anchor="middle" font-size="11">只做一次最终舍入</text>

    <rect x="520" y="300" width="170" height="64" rx="5" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="605" y="323" text-anchor="middle" font-weight="700">⑤ 检查溢出/下溢</text>
    <text x="605" y="343" text-anchor="middle" font-size="12">阶码全 1 → ∞/NaN</text>
    <text x="605" y="358" text-anchor="middle" font-size="11">阶码全 0 → 非规格化/0</text>

    <rect x="290" y="300" width="170" height="64" rx="5" fill="#eef3e4" stroke="#6f8f45"/>
    <text x="375" y="323" text-anchor="middle" font-weight="700">结果编码</text>
    <text x="375" y="343" text-anchor="middle" font-size="12">S | e | f</text>
    <text x="375" y="358" text-anchor="middle" font-size="11">写回目标格式</text>

    <rect x="60" y="300" width="170" height="64" rx="5" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="145" y="323" text-anchor="middle" font-weight="700">特殊情况</text>
    <text x="145" y="343" text-anchor="middle" font-size="12">NaN / ∞ 传播</text>
    <text x="145" y="358" text-anchor="middle" font-size="11">零的符号</text>

    <path d="M230 117 L290 117" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#fa)"/>
    <path d="M460 117 L520 117" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#fa)"/>
    <path d="M690 117 L750 117" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#fa)"/>
    <path d="M835 149 L835 300" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#fa)"/>
    <path d="M750 332 L690 332" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#fa)"/>
    <path d="M520 332 L460 332" stroke="#4d5b66" stroke-width="2" fill="none" marker-end="url(#fa)"/>
    <path d="M835 300 C900 260, 900 200, 835 149" stroke="#b54b45" stroke-width="2" fill="none" marker-end="url(#fb)"/>
    <text x="850" y="235" fill="#b54b45" font-size="12">尾数变 10.xxx：再右规一次</text>

    <text x="60" y="430" font-size="13" font-weight="700">三条关键规则</text>
    <text x="60" y="456" font-size="13">1. 对阶只把小阶改大，尾数右移；不要反过来降低大数精度。</text>
    <text x="60" y="480" font-size="13">2. G/R/S 在对阶和规格化中保留，最终只舍入一次，避免误差累积。</text>
    <text x="60" y="504" font-size="13">3. 舍入进位导致尾数溢出时要再右规；阶码到全 1 变无穷，进入全 0 区间转非规格化。</text>
    <text x="60" y="540" font-size="12" fill="#6b777f">本图是运算流程示意；实际数据通路可能把规格化与舍入部分并行，但判断顺序不变。</text>
    <text x="60" y="565" font-size="12" fill="#6b777f">“特殊情况”与主流程并行：先判零/无穷/NaN 可避免无效的尾数运算，不是结果之后的步骤。</text>
  </g>
</svg>
