<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-label="归并排序的分割与合并过程">
  <defs>
    <marker id="msa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4d5b66"/></marker>
  </defs>
  <rect width="1040" height="620" fill="#fffdf8"/>
  <text x="520" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">归并排序：先分到单元素，再两两合并成有序段</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="75" font-weight="700">原数组</text>
    <g>
      <rect x="70" y="95" width="80" height="40" fill="#e9f2f6" stroke="#4d7f95"/><text x="110" y="121" text-anchor="middle">49</text>
      <rect x="150" y="95" width="80" height="40" fill="#e9f2f6" stroke="#4d7f95"/><text x="190" y="121" text-anchor="middle">38</text>
      <rect x="230" y="95" width="80" height="40" fill="#e9f2f6" stroke="#4d7f95"/><text x="270" y="121" text-anchor="middle">27</text>
      <rect x="310" y="95" width="80" height="40" fill="#e9f2f6" stroke="#4d7f95"/><text x="350" y="121" text-anchor="middle">43</text>
      <rect x="390" y="95" width="80" height="40" fill="#e9f2f6" stroke="#4d7f95"/><text x="430" y="121" text-anchor="middle">9</text>
      <rect x="470" y="95" width="80" height="40" fill="#e9f2f6" stroke="#4d7f95"/><text x="510" y="121" text-anchor="middle">82</text>
    </g>

    <text x="45" y="190" font-weight="700">分割</text>
    <g>
      <rect x="70" y="210" width="80" height="38" fill="#f7f5ee" stroke="#c9c0ae"/><text x="110" y="234" text-anchor="middle">49</text>
      <rect x="150" y="210" width="80" height="38" fill="#f7f5ee" stroke="#c9c0ae"/><text x="190" y="234" text-anchor="middle">38</text>
      <rect x="230" y="210" width="80" height="38" fill="#f7f5ee" stroke="#c9c0ae"/><text x="270" y="234" text-anchor="middle">27</text>
      <rect x="310" y="210" width="80" height="38" fill="#f7f5ee" stroke="#c9c0ae"/><text x="350" y="234" text-anchor="middle">43</text>
      <rect x="390" y="210" width="80" height="38" fill="#f7f5ee" stroke="#c9c0ae"/><text x="430" y="234" text-anchor="middle">9</text>
      <rect x="470" y="210" width="80" height="38" fill="#f7f5ee" stroke="#c9c0ae"/><text x="510" y="234" text-anchor="middle">82</text>
    </g>
    <path d="M110 135 L110 210" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M190 135 L190 210" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M270 135 L270 210" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M350 135 L350 210" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M430 135 L430 210" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M510 135 L510 210" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>

    <text x="45" y="300" font-weight="700">两两合并</text>
    <g>
      <rect x="70" y="320" width="160" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="150" y="344" text-anchor="middle">38, 49</text>
      <rect x="240" y="320" width="160" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="320" y="344" text-anchor="middle">27, 43</text>
      <rect x="410" y="320" width="160" height="38" fill="#eef3e4" stroke="#6f8f45"/><text x="490" y="344" text-anchor="middle">9, 82</text>
    </g>
    <path d="M110 248 L130 320" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M190 248 L170 320" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M270 248 L290 320" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M350 248 L330 320" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M430 248 L450 320" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M510 248 L490 320" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>

    <text x="45" y="400" font-weight="700">合并成更大的有序段</text>
    <g>
      <rect x="70" y="420" width="300" height="38" fill="#f7ecd9" stroke="#a8782c"/><text x="220" y="444" text-anchor="middle">27, 38, 43, 49</text>
      <rect x="380" y="420" width="200" height="38" fill="#f7ecd9" stroke="#a8782c"/><text x="480" y="444" text-anchor="middle">9, 82</text>
    </g>
    <path d="M150 358 L180 420" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M320 358 L270 420" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M490 358 L450 420" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>

    <text x="45" y="505" font-weight="700">最后合并</text>
    <rect x="70" y="525" width="480" height="38" fill="#e9f2f6" stroke="#4d7f95"/><text x="310" y="549" text-anchor="middle">9, 27, 38, 43, 49, 82</text>
    <path d="M220 458 L250 525" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>
    <path d="M480 458 L400 525" stroke="#4d5b66" stroke-width="1.5" marker-end="url(#msa)"/>

    <text x="590" y="465" font-size="12" fill="#52605a">每层合并总代价 O(n)，共 log₂n 层 → O(n log n)。</text>
    <text x="590" y="490" font-size="12" fill="#52605a">归并需要额外 O(n) 辅助空间；稳定排序。</text>
    <text x="590" y="545" font-size="12" fill="#b54b45">先分后合：分割不比较，合并时按双指针取较小者。</text>
  </g>
</svg>
