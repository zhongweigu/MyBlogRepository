<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" role="img" aria-label="单工、半双工与全双工通信">
  <defs>
    <marker id="cda" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3f6f8a"/></marker>
    <marker id="cdb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b54b45"/></marker>
  </defs>
  <rect width="1040" height="540" fill="#fffdf8"/>
  <text x="520" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">单工、半双工、全双工：看“能不能同时双向”</text>
  <g font-family="sans-serif" font-size="14" fill="#24313a">
    <text x="45" y="80" font-weight="700">单工：只有一个方向</text>
    <text x="90" y="120">A</text><text x="870" y="120">B</text>
    <path d="M130 115 L840 115" stroke="#3f6f8a" stroke-width="3" marker-end="url(#cda)"/>
    <text x="430" y="150" font-size="12">广播、电视；B 不能回传</text>

    <text x="45" y="220" font-weight="700">半双工：两个方向，但不能同时</text>
    <text x="90" y="260">A</text><text x="870" y="260">B</text>
    <path d="M130 255 L840 255" stroke="#3f6f8a" stroke-width="3" marker-end="url(#cda)"/>
    <path d="M840 285 L130 285" stroke="#b54b45" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#cdb)"/>
    <text x="420" y="320" font-size="12">同一时刻只能一个方向；对讲机、早期 Hub</text>

    <text x="45" y="385" font-weight="700">全双工：两个方向可同时</text>
    <text x="90" y="425">A</text><text x="870" y="425">B</text>
    <path d="M130 420 L840 420" stroke="#3f6f8a" stroke-width="3" marker-end="url(#cda)"/>
    <path d="M840 450 L130 450" stroke="#b54b45" stroke-width="3" marker-end="url(#cdb)"/>
    <text x="420" y="485" font-size="12">电话、交换式以太网（点对点全双工）</text>

    <rect x="45" y="505" width="950" height="22" rx="4" fill="#f7f5ee" stroke="#c9c0ae"/>
    <text x="60" y="521" font-size="11" fill="#52605a">逻辑方向 ≠ 物理信道条数；半双工可以有一条双向信道，也可以有两条单向信道但不同时使用。</text>
  </g>
</svg>
