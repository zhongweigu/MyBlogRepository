<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="虚拟地址到物理地址再到 Cache 的完整访问路径">
  <rect width="1200" height="650" fill="#fffdf8"/>
  <g font-family="Avenir Next, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="40" y="34" fill="#b54634" font-size="11" font-weight="800" letter-spacing="2">ONE TYPICAL EXAM PICTURE</text>
    <text x="40" y="58" fill="#1f2328" font-size="22" font-weight="700">一条地址的完整旅程：VA → TLB / 页表 → PA → Cache</text>

    <!-- VA -->
    <g>
      <text x="40" y="104" fill="#667078" font-size="12">虚拟地址 VA</text>
      <rect x="40" y="116" width="430" height="54" fill="#f8f2e7" stroke="#1f2328" stroke-width="1.2"/>
      <line x1="330" y1="116" x2="330" y2="170" stroke="#1f2328" stroke-width="1.2"/>
      <text x="185" y="149" fill="#1f2328" font-size="15" text-anchor="middle">虚页号 VPN</text>
      <text x="380" y="149" fill="#1f2328" font-size="15" text-anchor="middle">页内偏移</text>
      <text x="40" y="190" fill="#667078" font-size="11">页内偏移在转换前后保持不变</text>
    </g>

    <!-- TLB -->
    <g>
      <rect x="540" y="100" width="220" height="88" fill="#e8f2ef" stroke="#14756f" stroke-width="1.4"/>
      <text x="650" y="128" fill="#14756f" font-size="15" font-weight="700" text-anchor="middle">TLB</text>
      <text x="650" y="150" fill="#1f2328" font-size="11" text-anchor="middle">VPN → PFN 的最近映射</text>
      <text x="650" y="168" fill="#667078" font-size="10.5" text-anchor="middle">命中：直接拿页框号</text>
    </g>
    <line x1="470" y1="143" x2="536" y2="143" stroke="#1f2328" stroke-width="1.3" marker-end="url(#a1)"/>
    <text x="490" y="133" fill="#667078" font-size="10">VPN</text>

    <!-- page table -->
    <g>
      <rect x="540" y="268" width="220" height="112" fill="#f6efe4" stroke="#a9651f" stroke-width="1.4"/>
      <text x="650" y="296" fill="#a9651f" font-size="15" font-weight="700" text-anchor="middle">页表（可多级）</text>
      <text x="650" y="318" fill="#1f2328" font-size="11" text-anchor="middle">页表项：有效位 + 页框号</text>
      <text x="650" y="338" fill="#667078" font-size="10.5" text-anchor="middle">未命中 TLB 时才访问</text>
      <text x="650" y="358" fill="#667078" font-size="10.5" text-anchor="middle">缺页 → OS 从磁盘调页</text>
    </g>
    <line x1="650" y1="190" x2="650" y2="264" stroke="#14756f" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#a2)"/>
    <text x="662" y="228" fill="#14756f" font-size="10.5">TLB miss</text>

    <!-- PA -->
    <g>
      <text x="860" y="104" fill="#667078" font-size="12">物理地址 PA</text>
      <rect x="860" y="116" width="300" height="54" fill="#eef2f8" stroke="#355f91" stroke-width="1.2"/>
      <line x1="1010" y1="116" x2="1010" y2="170" stroke="#355f91" stroke-width="1"/>
      <line x1="1080" y1="116" x2="1080" y2="170" stroke="#355f91" stroke-width="1"/>
      <text x="935" y="149" fill="#1f2328" font-size="14" text-anchor="middle">Tag</text>
      <text x="1045" y="149" fill="#1f2328" font-size="14" text-anchor="middle">索引</text>
      <text x="1140" y="149" fill="#1f2328" font-size="14" text-anchor="middle">块内偏移</text>
    </g>
    <line x1="760" y1="143" x2="856" y2="143" stroke="#14756f" stroke-width="1.6" marker-end="url(#a3)"/>
    <text x="782" y="133" fill="#14756f" font-size="10.5">TLB hit</text>
    <line x1="760" y1="324" x2="830" y2="324" stroke="#a9651f" stroke-width="1.3"/>
    <line x1="830" y1="324" x2="830" y2="143" stroke="#a9651f" stroke-width="1.3"/>
    <line x1="830" y1="143" x2="856" y2="143" stroke="#a9651f" stroke-width="1.3" marker-end="url(#a2)"/>
    <text x="792" y="300" fill="#a9651f" font-size="10.5">PFN 拼上偏移</text>

    <!-- cache -->
    <g>
      <rect x="860" y="268" width="300" height="122" fill="#eef2f8" stroke="#355f91" stroke-width="1.4"/>
      <text x="1010" y="296" fill="#355f91" font-size="15" font-weight="700" text-anchor="middle">Cache</text>
      <text x="1010" y="318" fill="#1f2328" font-size="11" text-anchor="middle">用 PA 的 Tag / 索引查行</text>
      <text x="1010" y="338" fill="#667078" font-size="10.5" text-anchor="middle">命中：取数据返回 CPU</text>
      <text x="1010" y="358" fill="#667078" font-size="10.5" text-anchor="middle">缺失：到主存取整块</text>
    </g>
    <line x1="950" y1="170" x2="950" y2="264" stroke="#355f91" stroke-width="1.3" marker-end="url(#a3)"/>
    <text x="960" y="220" fill="#355f91" font-size="10.5">PA</text>

    <!-- memory -->
    <g>
      <rect x="860" y="450" width="300" height="82" fill="#f8f2e7" stroke="#1f2328" stroke-width="1.2"/>
      <text x="1010" y="480" fill="#1f2328" font-size="14" font-weight="700" text-anchor="middle">主存</text>
      <text x="1010" y="501" fill="#667078" font-size="10.5" text-anchor="middle">Cache 缺失时按块调入</text>
      <text x="1010" y="519" fill="#667078" font-size="10.5" text-anchor="middle">缺页时页面从磁盘调入主存</text>
    </g>
    <line x1="1010" y1="390" x2="1010" y2="446" stroke="#355f91" stroke-width="1.3" marker-end="url(#a3)"/>
    <text x="1022" y="423" fill="#355f91" font-size="10.5">miss</text>

    <!-- questions -->
    <g>
      <rect x="40" y="268" width="430" height="264" fill="#fffaf4" stroke="#d9d2c4" stroke-width="1"/>
      <text x="58" y="296" fill="#b54634" font-size="11" font-weight="800" letter-spacing="1">这类题通常怎么问</text>
      <text x="58" y="324" fill="#1f2328" font-size="12">① 拆 VA：虚页号几位、页内偏移几位？</text>
      <text x="58" y="348" fill="#1f2328" font-size="12">② TLB 命中/缺失时，各访问几次主存？</text>
      <text x="58" y="372" fill="#1f2328" font-size="12">③ 页表项有效位、脏位、访问位各管什么？</text>
      <text x="58" y="396" fill="#1f2328" font-size="12">④ 物理地址如何再拆成 Cache 的 Tag/索引/偏移？</text>
      <text x="58" y="420" fill="#1f2328" font-size="12">⑤ Cache 命中率、AMAT、缺页处理怎么算？</text>
      <text x="58" y="452" fill="#667078" font-size="10.5">先画这条链，再把题目给的位数填进每个框。</text>
      <text x="58" y="470" fill="#667078" font-size="10.5">不要一上来套公式；先判断命中/缺失走哪条支路。</text>
      <text x="58" y="500" fill="#14756f" font-size="10.5">对应考点：虚拟存储器 / Cache / TLB</text>
    </g>
  </g>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f2328"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9651f"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#355f91"/></marker>
  </defs>
</svg>
