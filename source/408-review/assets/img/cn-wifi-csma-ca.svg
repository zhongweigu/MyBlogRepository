<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-label="802.11 CSMA/CA 的 DIFS、退避、RTS/CTS 和 ACK">
  <rect width="1080" height="520" fill="#fffdf8"/>
  <text x="540" y="32" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">802.11 CSMA/CA：先等 DIFS，再退避，必要时 RTS/CTS</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <text x="45" y="85" font-weight="700">发送方</text>
    <text x="45" y="245" font-weight="700">接收方</text>
    <line x1="45" y1="110" x2="1020" y2="110" stroke="#4d5b66"/>
    <line x1="45" y1="270" x2="1020" y2="270" stroke="#4d5b66"/>

    <rect x="70" y="115" width="90" height="25" fill="#f7f5ee" stroke="#c9c0ae"/><text x="115" y="132" text-anchor="middle" font-size="11">DIFS</text>
    <rect x="160" y="115" width="80" height="25" fill="#e9f2f6" stroke="#4d7f95"/><text x="200" y="132" text-anchor="middle" font-size="11">退避</text>
    <rect x="240" y="115" width="80" height="25" fill="#eef3e4" stroke="#6f8f45"/><text x="280" y="132" text-anchor="middle" font-size="11">RTS</text>
    <rect x="390" y="115" width="80" height="25" fill="#f7ecd9" stroke="#a8782c"/><text x="430" y="132" text-anchor="middle" font-size="11">DATA</text>

    <path d="M320 140 L390 250" stroke="#4d5b66" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="325" y="190" font-size="11">SIFS</text>
    <path d="M470 140 L540 250" stroke="#4d5b66" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="480" y="190" font-size="11">SIFS</text>

    <rect x="390" y="275" width="80" height="25" fill="#eef3e4" stroke="#6f8f45"/><text x="430" y="292" text-anchor="middle" font-size="11">CTS</text>
    <rect x="540" y="275" width="80" height="25" fill="#f3e6e6" stroke="#a85a5a"/><text x="580" y="292" text-anchor="middle" font-size="11">ACK</text>
    <text x="620" y="292" font-size="11">接收方用 SIFS 优先回复</text>

    <text x="45" y="350" font-weight="700">为什么无线不用 CSMA/CD</text>
    <text x="45" y="375">无线发送时难以同时可靠监听自己的信号（隐藏终端/衰减），所以用 CSMA/CA：尽量“避免”冲突，再用 ACK 确认。</text>
    <text x="45" y="400" font-size="12" fill="#52605a">RTS/CTS 预约信道，缓解隐藏终端；ACK 让发送方知道帧真的到达。</text>

    <text x="45" y="445" font-weight="700">帧间间隔</text>
    <text x="45" y="470">SIFS &lt; PIFS &lt; DIFS：SIFS 最短，用于 ACK/CTS 等高优先级响应；DIFS 用于普通数据竞争。</text>
    <text x="45" y="495" font-size="12" fill="#b54b45">CSMA/CA 不能完全消除冲突；它是“尽量避免 + 确认重传”。</text>
  </g>
</svg>
