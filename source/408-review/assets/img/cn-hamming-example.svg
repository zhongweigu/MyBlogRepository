<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-label="7,4 海明码：1010 的编码与第5位出错后的定位">
  <rect width="1120" height="760" fill="#fffdf8"/>
  <text x="560" y="30" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#24313a">(7,4) 海明码：以数据 1010、奇校验为例</text>
  <g font-family="sans-serif" font-size="13" fill="#24313a">
    <text x="45" y="70" font-weight="700">① 位置与内容</text>
    <g font-size="12">
      <text x="55" y="100">位置</text><text x="150" y="100">1</text><text x="220" y="100">2</text><text x="290" y="100">3</text><text x="360" y="100">4</text><text x="430" y="100">5</text><text x="500" y="100">6</text><text x="570" y="100">7</text>
      <text x="55" y="125">二进制</text><text x="145" y="125">001</text><text x="215" y="125">010</text><text x="285" y="125">011</text><text x="355" y="125">100</text><text x="425" y="125">101</text><text x="495" y="125">110</text><text x="565" y="125">111</text>
      <rect x="130" y="140" width="55" height="35" fill="#f7ecd9" stroke="#a8782c"/><text x="157" y="162" text-anchor="middle" font-weight="700">0</text>
      <rect x="200" y="140" width="55" height="35" fill="#f7ecd9" stroke="#a8782c"/><text x="227" y="162" text-anchor="middle" font-weight="700">1</text>
      <rect x="270" y="140" width="55" height="35" fill="#e9f2f6" stroke="#4d7f95"/><text x="297" y="162" text-anchor="middle">1</text>
      <rect x="340" y="140" width="55" height="35" fill="#f7ecd9" stroke="#a8782c"/><text x="367" y="162" text-anchor="middle" font-weight="700">0</text>
      <rect x="410" y="140" width="55" height="35" fill="#e9f2f6" stroke="#4d7f95"/><text x="437" y="162" text-anchor="middle">0</text>
      <rect x="480" y="140" width="55" height="35" fill="#e9f2f6" stroke="#4d7f95"/><text x="507" y="162" text-anchor="middle">1</text>
      <rect x="550" y="140" width="55" height="35" fill="#e9f2f6" stroke="#4d7f95"/><text x="577" y="162" text-anchor="middle">0</text>
      <text x="625" y="160" font-size="12">← 码字 0110010</text>
    </g>
    <text x="45" y="205" font-size="12">数据 1010 放在 3、5、6、7 位；校验位 p1、p2、p4 放在 1、2、4 位。</text>

    <text x="45" y="245" font-weight="700">② 三组奇校验（每组 1 的个数为奇数）</text>
    <g font-size="12">
      <rect x="45" y="260" width="980" height="42" fill="#eef3e4" stroke="#6f8f45"/>
      <text x="60" y="286">p1 组：位置 1,3,5,7 → 0,1,0,0 → 1 个 1（奇数），p1=0 合格</text>
      <rect x="45" y="308" width="980" height="42" fill="#eef3e4" stroke="#6f8f45"/>
      <text x="60" y="334">p2 组：位置 2,3,6,7 → 1,1,1,0 → 3 个 1（奇数），p2=1 合格</text>
      <rect x="45" y="356" width="980" height="42" fill="#eef3e4" stroke="#6f8f45"/>
      <text x="60" y="382">p4 组：位置 4,5,6,7 → 0,0,1,0 → 1 个 1（奇数），p4=0 合格</text>
    </g>
    <text x="45" y="425" font-size="12">编码结果：p1 p2 d1 p4 d2 d3 d4 = 0 1 1 0 0 1 0 → 0110010。</text>

    <text x="45" y="465" font-weight="700">③ 假设第 5 位由 0 错成 1</text>
    <g font-size="12">
      <rect x="130" y="480" width="55" height="35" fill="#f7ecd9" stroke="#a8782c"/><text x="157" y="502" text-anchor="middle">0</text>
      <rect x="200" y="480" width="55" height="35" fill="#f7ecd9" stroke="#a8782c"/><text x="227" y="502" text-anchor="middle">1</text>
      <rect x="270" y="480" width="55" height="35" fill="#e9f2f6" stroke="#4d7f95"/><text x="297" y="502" text-anchor="middle">1</text>
      <rect x="340" y="480" width="55" height="35" fill="#f7ecd9" stroke="#a8782c"/><text x="367" y="502" text-anchor="middle">0</text>
      <rect x="410" y="480" width="55" height="35" fill="#ffd9b0" stroke="#b54b45"/><text x="437" y="502" text-anchor="middle" font-weight="700">1</text>
      <rect x="480" y="480" width="55" height="35" fill="#e9f2f6" stroke="#4d7f95"/><text x="507" y="502" text-anchor="middle">1</text>
      <rect x="550" y="480" width="55" height="35" fill="#e9f2f6" stroke="#4d7f95"/><text x="577" y="502" text-anchor="middle">0</text>
      <text x="625" y="500" font-size="12">收到 0110110</text>
    </g>

    <text x="45" y="540" font-weight="700">④ 重新分组，得到 syndrome</text>
    <g font-size="12">
      <text x="45" y="565">p1 组 0,1,1,0：1 的个数为 2（偶）→ 出错 → s1=1，说明位置 1/3/5/7 中有错</text>
      <text x="45" y="587">p2 组 1,1,1,0：1 的个数为 3（奇）→ 没出错 → s2=0，说明位置 2/3/6/7 中没错</text>
      <text x="45" y="609">p4 组 0,1,1,0：1 的个数为 2（偶）→ 出错 → s4=1，说明位置 4/5/6/7 中有错</text>
    </g>
    <text x="45" y="645" font-size="16" font-family="serif">s4 s2 s1 = 101 = 5 → 第 5 位出错，翻转第 5 位即可</text>
    <text x="45" y="680" font-size="12" fill="#52605a">000 表示没有检测到错；非 0 的二进制值就是出错位的位置。syndrome 正好指到 p1/p2/p4 自己时，也说明对应校验位出错。</text>
    <text x="45" y="710" font-size="12" fill="#b54b45">(7,4) 海明码 d0=3：只能纠 1 位，或检 2 位；同时错 2 位可能被误纠，不能当成能纠 2 位。</text>
    <text x="45" y="738" font-size="12" fill="#6b777f">这里的例子用奇校验；用偶校验时方程改为“每组 1 的个数为偶数”，方法完全一样。</text>
  </g>
</svg>
