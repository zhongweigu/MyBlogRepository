<h2 id="6-">考点6-队列的应用</h2>
<p>这部分一般出选择题，记住下面几组场景就够了。</p>
<p><strong>用队列辅助实现的算法</strong>：二叉树的层次遍历、BFS、BFS 求单源最短路径。</p>
<p><strong>队列的常用场景</strong>：</p>
<ol>
<li>要求<strong>公平调度</strong>：就绪队列、阻塞队列、各种请求队列等；</li>
<li>需要<strong>排队处理数据的缓冲区</strong>；</li>
<li><strong>多级反馈队列</strong>调度算法。</li>
</ol>
